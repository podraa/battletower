<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Agency</title>
<style>
:root{
  --bg:#f6f7fb;--panel:#fff;--panel2:#f0f2f7;--border:#d9ddea;
  --text:#202433;--dim:#697083;--accent:#5367d8;--taken:#8a8f9d;--available:#3d8c62;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.modal-open{overflow:hidden}

/* page nav */
.page-nav{position:fixed;top:14px;right:18px;z-index:20;display:flex;gap:7px;align-items:center}
.page-nav label{font-size:11px;font-weight:700;color:var(--dim)}
.page-nav select{padding:7px 30px 7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text)}
.page-nav select:disabled{opacity:.45;cursor:not-allowed}
.page-nav .lock-hint{font-size:10.5px;color:var(--dim);opacity:.85}

#app{max-width:1500px;margin:auto;padding:70px 24px 40px}
header{margin-bottom:22px}
h1{margin:0 0 6px;font-size:28px}
.sub,.note{color:var(--dim);line-height:1.5}

/* toolbar */
.toolbar{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px;margin:18px 0 14px;padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.toolbar>div{grid-column:span 2;min-width:0}
.toolbar>div.toolbar-wide{grid-column:span 3;min-width:0}
.toolbar>.clear-filters{grid-column:span 2}
label{display:block;font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
input[type=text],input[type=number],select.filter-select{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font:inherit;font-size:13px;
}
input[type=text]:focus,select.filter-select:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* type chips */
.type-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.type-chip{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
  cursor:pointer;border:2px solid transparent;transition:.1s;user-select:none;
  text-transform:capitalize;
}
.type-chip:hover{filter:brightness(.88)}
.type-chip.active{border-color:rgba(0,0,0,.35);filter:brightness(.82)}

/* type colours */
.type-normal{background:#A8A77A;color:#fff}
.type-fire{background:#EE8130;color:#fff}
.type-water{background:#6390F0;color:#fff}
.type-electric{background:#F7D02C;color:#333}
.type-grass{background:#7AC74C;color:#fff}
.type-ice{background:#96D9D6;color:#333}
.type-fighting{background:#C22E28;color:#fff}
.type-poison{background:#A33EA1;color:#fff}
.type-ground{background:#E2BF65;color:#333}
.type-flying{background:#A98FF3;color:#fff}
.type-psychic{background:#F95587;color:#fff}
.type-bug{background:#A6B91A;color:#fff}
.type-rock{background:#B6A136;color:#fff}
.type-ghost{background:#735797;color:#fff}
.type-dragon{background:#6F35FC;color:#fff}
.type-dark{background:#705746;color:#fff}
.type-steel{background:#B7B7CE;color:#333}
.type-fairy{background:#D685AD;color:#fff}

/* summary bar */
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 20px}
.stat{padding:10px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;min-width:110px}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat .note{margin:0;font-size:11px}

/* tiers */
.tier{margin:0 0 28px}
.tier-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tier-head h2{margin:0;font-size:16px;font-weight:800}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mon{
  position:relative;min-height:190px;padding:12px 10px;
  border:1px solid var(--border);border-radius:12px;background:var(--panel2);
  cursor:pointer;transition:.12s;display:flex;flex-direction:column;align-items:center;
}
.mon:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,0,0,.10)}
.mon.taken{opacity:1;cursor:pointer;background:var(--panel);border-color:var(--border)}
.mon img{display:block;width:86px;height:86px;object-fit:contain;image-rendering:pixelated;margin-bottom:4px}
.mon-name{font-weight:800;font-size:13px;text-align:center;margin-top:2px}
.mon-points{text-align:center;margin-top:4px;color:var(--accent);font-weight:800;font-size:13px}
.mon-types{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.mon-type-badge{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;
  text-transform:capitalize;
}
.mon-status{text-align:center;margin-top:6px;font-size:11px;font-weight:700}
.mon-status.available{color:var(--available)}
.mon-status.taken-status{color:var(--taken)}

/* no results */
.empty{padding:34px;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--dim);background:var(--panel)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;animation:modalFade .18s ease both}.modalbox{width:min(480px,calc(100vw - 32px));max-height:min(680px,calc(100vh - 40px));overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:24px;animation:modalPop .24s cubic-bezier(.16,1,.3,1) both;box-shadow:0 28px 90px rgba(0,0,0,.38)}
.modalbox h2{font-size:22px;line-height:1.15}.modalbox strong{color:var(--accent)}
@keyframes modalFade{from{opacity:0}to{opacity:1}}@keyframes modalPop{from{opacity:0;transform:translateY(14px) scale(.965)}to{opacity:1;transform:translateY(0) scale(1)}}

.modalbox h2{margin:0 0 6px}
.modal-types{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font:inherit;box-shadow:none}
.btn:hover{border-color:var(--accent);background:var(--panel-alt);color:var(--text)}
.modalbox .btn{color:var(--dim)!important;background:transparent!important;border-color:color-mix(in srgb,var(--border) 70%,transparent)!important;box-shadow:none!important;font-weight:600;transition:background .14s ease,border-color .14s ease,color .14s ease}
.modalbox .btn:hover{color:var(--text)!important;background:color-mix(in srgb,var(--panel2) 55%,transparent)!important;border-color:var(--border)!important}
.modalbox .btn:active{background:color-mix(in srgb,var(--panel2) 75%,transparent)!important}

/* availability toggle */
.avail-toggle{display:flex;gap:6px}
.avail-btn{
  padding:7px 13px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:var(--panel2);color:var(--dim);transition:.1s;
}
.avail-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* clear filters */
.clear-filters{
  padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
  border:1px solid var(--border);background:none;color:var(--dim);white-space:nowrap;
  align-self:flex-end;
}
.clear-filters:hover{color:var(--text);border-color:var(--text)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@media(max-width:900px){.toolbar{grid-template-columns:repeat(6,minmax(0,1fr))}.toolbar>div,.toolbar>div.toolbar-wide{grid-column:span 3}}
@media(max-width:700px){
  #app{padding:60px 12px 30px}
  .page-nav{top:8px;right:8px}
  .page-nav label{display:none}
  .page-nav .lock-hint{display:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbar{padding:12px}
  .toolbar>div,.toolbar>div.toolbar-wide{min-width:0;flex:1 1 140px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<style>
.page-nav{width:100%;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:10px 16px;margin:0 0 20px;border-bottom:1px solid var(--border,#ddd);background:var(--panel,#fff);box-sizing:border-box;position:relative;z-index:50}
.page-nav a{display:inline-flex;align-items:center;justify-content:center;padding:8px 13px;border-radius:8px;color:var(--text,#222);text-decoration:none;font-size:12px;font-weight:700;white-space:nowrap;transition:background .15s,border-color .15s,color .15s; border:1px solid transparent}
.page-nav a:hover{background:var(--panel-alt,#f4f4f4);border-color:var(--border,#ddd)}
.page-nav a.active{background:var(--panel-alt,#f4f4f4);border-color:var(--border,#ddd);color:var(--amber,var(--accent,#c98b2e))}
.page-nav.locked a{opacity:.45;cursor:not-allowed}
.page-nav.locked a:hover{background:transparent;border-color:transparent}
.page-nav .nav-lock-hint{font-size:11px;color:var(--text-dim,#777);font-weight:600;margin-left:6px}
@media(max-width:700px){.page-nav{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding:8px 10px}.page-nav a{flex:0 0 auto}}
</style>
<style>
/* Auto-hiding site navigation */
body{padding-top:58px;}
.page-nav{position:fixed;top:0;left:0;right:0;width:100%;height:58px;margin:0;padding:9px 16px;box-shadow:0 6px 18px rgba(0,0,0,.18);transform:translateY(0);transition:transform .22s ease,box-shadow .22s ease;z-index:1000;}
.page-nav.nav-hidden{transform:translateY(-100%);box-shadow:none;}
.page-nav a{flex:0 0 auto;}
.nav-hover-zone{position:fixed;top:0;left:0;right:0;height:9px;z-index:1001;}
@media(max-width:700px){body{padding-top:52px}.page-nav{height:52px;padding:7px 10px;overflow-x:auto;flex-wrap:nowrap}.nav-hover-zone{height:8px}}
</style>

<style id="mobile-friendly-overrides">
/* Site-wide mobile usability pass */
html{overflow-x:hidden;-webkit-text-size-adjust:100%;}
body{overflow-x:hidden;max-width:100%;}
img,video,canvas,svg{max-width:100%;}
button,input,select,textarea{font:inherit;max-width:100%;}
button{touch-action:manipulation;}

@media (max-width: 700px){
  body{font-size:14px;}
  #app{width:100%;max-width:none;box-sizing:border-box;padding-left:12px !important;padding-right:12px !important;}
  header{padding-left:0 !important;padding-right:0 !important;}
  header h1,h1{font-size:clamp(22px,7vw,32px);line-height:1.12;overflow-wrap:anywhere;}
  h2{font-size:clamp(18px,5.5vw,24px);}
  h3{font-size:17px;}
  .sub,.note,.panel-desc{overflow-wrap:anywhere;}

  /* Public header navigation */
  .page-nav{max-width:100vw;box-sizing:border-box;}
  .page-nav a{min-height:36px;padding:8px 11px;font-size:12px;}
  .page-nav::-webkit-scrollbar{height:3px;}

  /* Admin's dropdown navigation */
  body[data-admin="true"] .page-nav{max-width:calc(100vw - 16px);}
  body[data-admin="true"] .page-nav select{max-width:calc(100vw - 32px);}

  /* Stacked controls instead of cramped horizontal rows */
  .toolbar,.toolbar-wide,.banner-controls,.section-head-row,.trade-tab-head,.summary-header,
  .franchise-header,.franchise-card-head,.team-card-head,.team-card-top,.speed-header,
  .replay-teams,.replay-row,.compare-team,.trade-filter-panel{max-width:100%;}
  .toolbar,.toolbar-wide,.banner-controls{flex-wrap:wrap !important;gap:8px !important;}
  .toolbar > *, .toolbar-wide > *, .banner-controls > *{min-width:0 !important;max-width:100%;}

  /* Form controls become comfortable touch targets */
  input:not([type="checkbox"]):not([type="radio"]),
  select,textarea{min-height:40px;box-sizing:border-box;}
  input:not([type="checkbox"]):not([type="radio"]),select,textarea{width:100%;}
  input[type="checkbox"],input[type="radio"]{width:auto;min-height:auto;}
  button{min-height:40px;}
  .foot-actions,.actions,.franchise-actions{flex-wrap:wrap !important;gap:8px !important;}
  .foot-actions button,.actions button,.franchise-actions button{flex:1 1 auto;}

  /* Panels/cards */
  .panel,.card,.budget-card,.trade-card,.pokemon-card,.mon-card,.opponent-card,.set-card,
  .franchise-card,.team-card,.commissioner-budget-card{min-width:0 !important;max-width:100%;box-sizing:border-box;}
  .panel{padding:14px !important;}
  .grid,.roster-grid,.roster-cards,.pokemon-grid,.team-card-grid,.franchise-cards,
  .comparison-grid,.conference-standings,.mon-grid,.theme-grid{grid-template-columns:1fr !important;}
  .trade-cols,.trade-column-grid,.profile-two-col,.summary-grid,.record-grid{grid-template-columns:1fr !important;}
  .pick-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  .theme-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}

  /* Don't let long Pokémon/team names force horizontal scrolling */
  .pokemon-name,.team-name,.team-card-name,.standings-team-name,.pick-card-name,
  .mon-name,.opponent-name,.compare-team-name{overflow-wrap:anywhere;word-break:break-word;}

  /* Tables: preserve all columns, allow deliberate horizontal swipe */
  table{max-width:none;}
  .table-wrap,.franchise-table-wrap,#globalTable,#pokemonSearchTable,.player-table-wrap,
  .speed-table,.type-count-table{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-wrap table,.franchise-table-wrap table,#globalTable table,#pokemonSearchTable table,
  .player-table-wrap table,.speed-table table,.type-count-table table{min-width:max-content;}
  th,td{white-space:nowrap;}

  /* Modals fit inside a phone viewport */
  .modal,.modalbox,.overview-modal,.replay-summary-box,.pokemon-modal,.audit-modal,
  .modal-content{width:calc(100vw - 20px) !important;max-width:calc(100vw - 20px) !important;
    max-height:calc(100vh - 24px);box-sizing:border-box;}
  .modal-body,.pokemon-modal-body{overflow:auto;max-height:calc(100vh - 150px);}

  /* Stat/analysis rows stack cleanly */
  .gf-row{max-width:100%;}
  .death-cause-entry{max-width:100%;box-sizing:border-box;}
  .statbox{min-width:0 !important;}
  .speed-row{min-width:560px;}

  /* Draft / admin tab bars can scroll rather than squish buttons */
  .tabs{max-width:100%;overflow-x:auto;flex-wrap:nowrap !important;-webkit-overflow-scrolling:touch;}
  .tabs button{flex:0 0 auto;white-space:nowrap;}

  /* Make auth/login cards comfortable */
  #adminAuth,.gate{width:100%;max-width:420px;box-sizing:border-box;margin-left:auto;margin-right:auto;}
}

@media (max-width: 480px){
  #app{padding-left:9px !important;padding-right:9px !important;}
  .page-nav a{padding:7px 10px;font-size:11px;}
  .panel{padding:12px !important;}
  .pick-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  .theme-grid{grid-template-columns:1fr 1fr !important;}
  .sprite{max-width:44px;}
  .pokemon-head .sprite,.team-card-top-sprite{width:56px !important;height:56px !important;}
  .foot-actions button,.actions button,.franchise-actions button{width:100%;flex-basis:100%;}
  .section-head-row{align-items:flex-start !important;}
}
</style>

<style>[hidden]{display:none!important}</style>
<style id="sbl-global-theme-style">
:root{--sbl-theme-accent:var(--amber);--sbl-theme-bg:var(--bg);--sbl-theme-panel:var(--panel);--sbl-theme-panel-alt:var(--panel-alt);--sbl-theme-border:var(--border);--sbl-theme-text:var(--text);--sbl-theme-muted:var(--text-dim)}
/* Shared theme layer: keeps pages that use hard-coded colors visually in sync. */
body{background-color:var(--bg);color:var(--text)}
input,textarea,select{background-color:var(--panel-alt);border-color:var(--border);color:var(--text)}
button{color:var(--text)}
.panel,.card,.set-card,.statbox,.notice,.roster-toolbar,.ticker,.speed-matrix-wrap{background-color:var(--panel);border-color:var(--border)}
.mon,.mon-pill,.pick-card,.pick-card.checked,.chip,.badge,.speed-pin-chip{background-color:var(--panel-alt);border-color:var(--border)}
th{border-color:var(--border)}
td{border-color:var(--border)}
a{color:var(--amber)}
</style>

<script id="sbl-global-theme-loader" src="js/sbl-themes.js"></script>
<style id="sbl-theme-final-overrides">
/* Final site-wide theme surface and text pass */
:root{
  --sbl-card-bg:var(--panel);
  --sbl-card-alt:var(--panel-alt);
  --sbl-card-border:var(--border);
  --sbl-page-bg:var(--bg);
  --sbl-text:var(--text);
  --sbl-muted:var(--text-dim);
}

html,body{background:var(--sbl-page-bg) !important;color:var(--sbl-text);}

/* Major overview/team surfaces */
.team-card,
.overview-card,
.franchise-card,
.commissioner-budget-card,
.pokemon-card,
.hero,
.myteam-hero,
.myteam-card,
.myteam-panel,
.next-battle-card,
.myteam-budget,
.myteam-summary,
.myteam-mon-card,
.recent-battle-row,
.fixture-match,
.conference-block,
.conference-heading,
.roster-card,
.roster-team,
.free-agent-card,
.fa-card,
.team-analysis-card,
.switch-card,
.switch-card-detail,
.damage-calc-card,
.damage-calc-side,
.trade-col,
.trade-filter-panel,
#proposePanel,
#tradeSummary{
  background:var(--sbl-card-bg) !important;
  border-color:var(--sbl-card-border) !important;
  color:var(--sbl-text);
}

.team-card:hover,
.overview-card:hover,
.franchise-card:hover,
.pokemon-card:hover,
.free-agent-card:hover,
.standings-row:hover{
  background:var(--sbl-card-alt) !important;
}

/* Team cards previously had a hard-coded dark gradient. */
.team-card{background:var(--sbl-card-bg) !important;}

/* Secondary surfaces */
.mon,
.mon-pill,
.pick-card,
.pick-card.checked,
.chip,
.badge,
.speed-pin-chip,
.myteam-mon-stat,
.selected-chip{
  background:var(--sbl-card-alt);
  border-color:var(--sbl-card-border);
}

/* Inputs and controls */
input,textarea,select{
  background:var(--sbl-card-alt) !important;
  border-color:var(--sbl-card-border) !important;
  color:var(--sbl-text) !important;
}

/* Theme-aware headings and ordinary text. */
.panel h1,.panel h2,.panel h3,.panel h4,
.card h1,.card h2,.card h3,.card h4,
.team-card-name,.team-card-sub,
.team-name,.team-record,.death-cause-title,
.franchise-name,.franchise-sub,
.standings-team-name,.pokemon-name,.pick-card-name,
.section-title,.page-title,.card-title{
  color:var(--sbl-text) !important;
}

/* Table headings */
th{color:var(--sbl-text) !important;border-color:var(--sbl-card-border) !important;}
td{border-color:var(--sbl-card-border) !important;}

/* Positive results follow theme accent. */
.kills,.kill,.kill-count,.stat-kills,.stat-win,.stat-wins,
.win-count,.wins,.record-win,.fixture-result,.fixture-summary,
.myteam-summary-result,.result-win,.win-text,
.fixture-match.fixture-played .fixture-status{
  color:var(--teal) !important;
}

/* Losses use the theme-aware negative variable. */
.loss,.losses,.loss-count,.stat-loss,.stat-losses,.loss-text,
.record-loss,.result-loss,.form-pip.loss{
  color:var(--red) !important;
}

/* Fixture cards */
.fixture-team{color:var(--sbl-text) !important;}
.fixture-team.fixture-winner{color:var(--teal) !important;}
.fixture-status{
  background:var(--sbl-card-alt) !important;
  border-color:var(--sbl-card-border) !important;
  color:var(--sbl-muted) !important;
}

/* Ladder: never hide teams below the cutoff. */
.standings-row{
  opacity:1 !important;
  visibility:visible !important;
  filter:none !important;
  background:var(--sbl-card-bg) !important;
  color:var(--sbl-text) !important;
}

/* Modals/popouts */
.modal,.modal-card,.profile-modal,.summary-modal,.overview-modal,
.prep-detail-dialog,.prep-opponent-popout{
  background:var(--sbl-card-bg) !important;
  border-color:var(--sbl-card-border) !important;
  color:var(--sbl-text);
}

/* Keep Pokémon type badges readable; their white text is intentional. */
.type-badge,[class^="type-"],[class*=" type-"]{color:#fff !important;}
</style>

<style id="sbl-final-theme-ui-fix">
/* Final site-wide theme normalization.  All surfaces and semantic text use
   the active theme variables; fixed type colors remain intentionally untouched. */
html,body{background:var(--bg)!important;color:var(--text)!important}

/* Common surfaces */
.panel,.card,.set-card,.statbox,.notice,.team-card,.overview-card,
.franchise-card,.pokemon-card,.roster-card,.free-agent-card,.fa-card,
.team-analysis-card,.prep-opponent-card,.prep-switch-card,.switch-card-detail,
.speed-detail-card,.speed-matrix-wrap,.damage-calc-card,.damage-calc-side,
.damage-calc-grid,.myteam-card,.myteam-panel,.next-battle-card,
.budget-card,.replay-summary-box,.modalbox,.modal-card,.pokemon-modal,
.pokemon-profile,.conference-block,.fixture-match,.fixture-week,
.trade-col,.selected-chip,#tradeSummary,#proposePanel,
.showdown-import-card,.showdown-saved-item{
  color:var(--text);
  background-color:var(--panel);
  border-color:var(--border);
}

/* Secondary surfaces */
.mon,.mon-pill,.pick-card,.chip,.badge,.speed-pin-chip,
.meta-box,.profile-record-tab,.profile-grid>div,.speed-detail-card,
.dc-move-group,.dc-result-move,.dc-result-damage,.showdown-import-text,
.showdown-saved-actions button{

// Look up a mon's types synchronously. Tries the full normalized name, then
// known aliases, then progressively shorter prefixes (dropping one trailing
// hyphen-segment at a time) so any forme not explicitly listed above still
// resolves to its base species' typing rather than coming up empty.
function lookupTypes(name){
  const k=key(name);
  if(TYPE_TABLE[k]) return TYPE_TABLE[k];
  if(TYPE_ALIASES[k] && TYPE_TABLE[TYPE_ALIASES[k]]) return TYPE_TABLE[TYPE_ALIASES[k]];
  let parts=k.split('-');
  while(parts.length>1){
    parts=parts.slice(0,-1);
    const candidate=parts.join('-');
    if(TYPE_TABLE[candidate]) return TYPE_TABLE[candidate];
    if(TYPE_ALIASES[candidate] && TYPE_TABLE[TYPE_ALIASES[candidate]]) return TYPE_TABLE[TYPE_ALIASES[candidate]];
  }
  return [];
}

function typeBadge(t){
  return `<span class="mon-type-badge type-${t}">${esc(t)}</span>`;
}

  modal.innerHTML=`<div class="modalbox">
    <h2>${esc((SBL.pokemon.displayNameWithForm ? SBL.pokemon.displayNameWithForm(mon.name) : SBL.pokemon.displayName(mon.name)))}</h2>
    <div class="note">${mon.points} points · ${owner(mon.name)?'Drafted':'Available'}</div>
    <div class="modal-types">${types.map(typeBadge).join('')||''}</div>
    <p class="note">${owner(mon.name)?`Drafted by <strong>${esc(owner(mon.name))}</strong>.`:'This Pokémon is available — it does not appear on any currently published roster.'}</p>
    <div class="actions"><button class="btn" id="modalClose">Close</button></div>
  </div>`;
  document.body.appendChild(modal);
  document.body.classList.add('modal-open');
  const close=()=>{modal.remove();document.body.classList.remove('modal-open');document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape') close();};
  modal.querySelector('#modalClose').onclick=close;
  modal.onclick=e=>{if(e.target===modal)close();};
  document.addEventListener('keydown',onKey);
}

let lastDataSignature=null;

async function load(){
  const result=await SBL.freeAgency.load(db);
  settings=result.settings||settings;
  allRosters=result.rosters||{};
  const mons=result.pool||[];

  // Skip the (expensive, focus-stealing) re-render on the periodic 5s poll
  // unless the pool or rosters actually changed since last time.
  const signature=JSON.stringify({mons,allRosters});
  const changed=signature!==lastDataSignature;
  lastDataSignature=signature;
  if(changed) render();
}

function dexKey(name){
  return toShowdownId(name).replace(/[^a-z0-9-]/g,'');
}
function getDexEntry(name){
  const k=dexKey(name);
  if(dexData.pokedex[k]) return dexData.pokedex[k];
  const compact=k.replace(/-/g,'');
  if(dexData.pokedex[compact]) return dexData.pokedex[compact];
  const base=k.split('-')[0];
  return dexData.pokedex[base]||null;
}
function getLearnset(name){
  const k=dexKey(name);
  return dexData.learnsets[k]?.learnset || dexData.learnsets[k] || {};
}
const filterMemo=new Map();
function hasMove(name, needle){
  if(!needle) return true;
  const mk='m|'+key(name)+'|'+key(needle); if(filterMemo.has(mk)) return filterMemo.get(mk);
  const q=key(needle).replace(/-/g,'');
  if(!q) return true;
  const ls=getLearnset(name);
  const out=Object.keys(ls).some(m=>m.replace(/-/g,'').includes(q)); filterMemo.set(mk,out); return out;
}
function hasAbility(name, needle){
  if(!needle) return true;
  const mk='a|'+key(name)+'|'+key(needle); if(filterMemo.has(mk)) return filterMemo.get(mk);
  const q=String(needle).trim().toLowerCase();
  const e=getDexEntry(name);
  const out=Object.values(e?.abilities||{}).some(a=>String(a).toLowerCase().includes(q)); filterMemo.set(mk,out); return out;
}
function meetsStat(name, stat, min){
  if(!stat || min==='') return true;
  const mk='s|'+key(name)+'|'+stat+'|'+min; if(filterMemo.has(mk)) return filterMemo.get(mk);
  const e=getDexEntry(name), v=Number(e?.baseStats?.[stat]);
  const out=Number.isFinite(v) && v>=Number(min); filterMemo.set(mk,out); return out;
}
async function loadDexData(){
  if(dexData.loaded) return;
  try{
    const [p,l]=await Promise.all([
      fetch('https://play.pokemonshowdown.com/data/pokedex.json').then(r=>r.json()),
      fetch('https://play.pokemonshowdown.com/data/learnsets.json').then(r=>r.json())
    ]);
    dexData={pokedex:p,learnsets:l,loaded:true};
    render();
  }catch(err){
    console.warn('Pokémon filter data failed to load:',err);
    dexData.loaded=true;
  }
}
function scheduleFilterRender(){
  clearTimeout(filterRenderTimer);
  filterRenderTimer=setTimeout(()=>{ if(!document.hidden) renderResults(); },120);
}

function applyFilters(mons){
  return mons.filter(m=>{
    // name
    if(filterName && !String(m.name).toLowerCase().includes(filterName)) return false;
    // points
    if(filterPoints!=='' && String(Number(m.points))!==filterPoints) return false;
    // availability
    const taken=!!owner(m.name);
    if(filterAvail==='available' && taken) return false;
    if(filterAvail==='taken' && !taken) return false;
    if(filterMove && !hasMove(m.name,filterMove)) return false;
    if(filterAbility && !hasAbility(m.name,filterAbility)) return false;
    if(!meetsStat(m.name,filterStat,filterStatMin)) return false;
    if(filterTypes.size>0){
      const types=lookupTypes(m.name);
      if(!types.some(t=>filterTypes.has(t))) return false;
    }
    return true;
  });
}

function renderResults(){
  const allMons=Array.isArray(settings.freeAgency?.mons)?settings.freeAgency.mons:[];
  const visible=applyFilters(allMons);

  let free=0,taken=0;
  visible.forEach(m=>owner(m.name)?taken++:free++);

  const groups={};
  visible.forEach(m=>{const p=Number(m.points)||0;(groups[p]??=[]).push(m);});
  const tiers=Object.keys(groups).sort((a,b)=>Number(b)-Number(a));

  const results=$('results');
  if(!results) return;

  const activeFilters=(filterName?1:0)+(filterTypes.size>0?1:0)+(filterPoints!==''?1:0)+(filterAvail!=='all'?1:0)+(filterMove?1:0)+(filterAbility?1:0)+(filterStat?1:0)+(filterStatMin!==''?1:0);

  results.innerHTML=`
    <div class="summary">
      <div class="stat"><div class="note">Showing</div><b>${visible.length}</b></div>
      <div class="stat"><div class="note">Available</div><b>${free}</b></div>
      <div class="stat"><div class="note">Taken</div><b>${taken}</b></div>
      <div class="stat"><div class="note">Total pool</div><b>${allMons.length}</b></div>
      ${activeFilters?`<button class="clear-filters" id="clearFilters">Clear filters (${activeFilters})</button>`:''}
    </div>
    ${tiers.length ? tiers.map(p=>{
      const label=Number(p)===1?'1 POINT':`${p} POINTS`;
      return `<section class="tier">
        <div class="tier-head"><h2>${label}</h2><span class="note">${groups[p].length} shown</span></div>
        <div class="grid">${groups[p].map(m=>{
          const o=owner(m.name), types=lookupTypes(m.name);
          return `<article class="mon ${o?'taken':''}" data-name="${esc(m.name)}">
            ${sprite(m.name)}
            <div class="mon-name">${esc((SBL.pokemon.displayNameWithForm ? SBL.pokemon.displayNameWithForm(m.name) : SBL.pokemon.displayName(m.name)))}</div>
            <div class="mon-points">${m.points} pts</div>
            <div class="mon-types">${types.map(typeBadge).join('')}</div>
            <div class="mon-status ${o?'taken-status':'available'}">${o?'Drafted by '+esc(o):'Available'}</div>
          </article>`;
        }).join('')}</div>
      </section>`;
    }).join('') : `<div class="empty">${allMons.length?'No Pokémon match your filters.':'No Free Agency pool has been published yet.'}</div>`}`;

  const clearBtn=$('clearFilters');
  if(clearBtn) clearBtn.onclick=()=>{
    filterName='';filterTypes.clear();filterPoints='';filterAvail='all';filterMove='';filterAbility='';filterStat='';filterStatMin='';
    syncFilterControls();
    renderResults();
  };

  results.querySelectorAll('.mon').forEach(el=>el.onclick=()=>{
    const m=allMons.find(x=>key(x.name)===key(el.dataset.name));
    if(m) openSelection(m);
  });
}

function syncFilterControls(){
  const vals={
    searchName:filterName, filterMove, filterAbility, filterStatMin
  };
  Object.entries(vals).forEach(([id,val])=>{
    const el=$(id); if(el && document.activeElement!==el && el.value!==val) el.value=val;
  });
  const points=$('filterPoints');
  if(points){
    const allMons=Array.isArray(settings.freeAgency?.mons)?settings.freeAgency.mons:[];
    const pointValues=[...new Set(allMons.map(m=>Number(m.points)).filter(Number.isFinite))].sort((a,b)=>b-a);
    const wanted=filterPoints;
    points.innerHTML='<option value="">All point values</option>'+pointValues.map(p=>`<option value="${p}">${p} pts</option>`).join('');
    points.value=pointValues.some(p=>String(p)===wanted)?wanted:'';
    if(points.value!==wanted) filterPoints='';
  }
  const stat=$('filterStat'); if(stat && stat.value!==filterStat) stat.value=filterStat;
  document.querySelectorAll('[data-avail]').forEach(btn=>btn.classList.toggle('active',btn.dataset.avail===filterAvail));
  document.querySelectorAll('[data-type]').forEach(chip=>chip.classList.toggle('active',filterTypes.has(chip.dataset.type)));
}

function render(){
  const allMons=Array.isArray(settings.freeAgency?.mons)?settings.freeAgency.mons:[];
  if($('results') && $('searchName') && $('filterMove') && $('filterAbility')){
    renderResults();
    syncFilterControls();
    return;
  }

  const pointValues=[...new Set(allMons.map(m=>Number(m.points)||0))].sort((a,b)=>b-a);

  $('main').innerHTML=`
    <div class="toolbar">
      <div class="toolbar-wide"><label>Search by name</label><input type="text" id="searchName" value="${esc(filterName)}" placeholder="e.g. Landorus, Cinderace…" autocomplete="off"></div>
      <div class="points-filter"><label for="filterPoints">Points</label><select class="filter-select" id="filterPoints"><option value="">All point values</option>${pointValues.map(p=>`<option value="${p}" ${filterPoints===String(p)?'selected':''}>${p} pts</option>`).join('')}</select></div>
      <div><label>Availability</label><div class="avail-toggle"><button class="avail-btn ${filterAvail==='all'?'active':''}" data-avail="all">All</button><button class="avail-btn ${filterAvail==='available'?'active':''}" data-avail="available">Available</button><button class="avail-btn ${filterAvail==='taken'?'active':''}" data-avail="taken">Taken</button></div></div>
      <div class="toolbar-wide"><label>Move</label><input type="text" id="filterMove" value="${esc(filterMove)}" placeholder="e.g. Earthquake, Knock Off…" autocomplete="off"></div>
      <div class="toolbar-wide"><label>Ability</label><input type="text" id="filterAbility" value="${esc(filterAbility)}" placeholder="e.g. Intimidate, Levitate…" autocomplete="off"></div>
      <div><label>Base stat</label><select class="filter-select" id="filterStat"><option value=""> </option>${[['hp','HP'],['atk','Attack'],['def','Defense'],['spa','Sp. Atk'],['spd','Sp. Def'],['spe','Speed']].map(([v,n])=>`<option value="${v}" ${filterStat===v?'selected':''}>${n}</option>`).join('')}</select></div>
      <div><label>Minimum</label><input type="number" id="filterStatMin" min="1" max="255" value="${esc(filterStatMin)}" placeholder="e.g. 120"></div>
    </div>
    <div class="type-filter-wrap"><label>Filter by type</label><div class="type-chips">${ALL_TYPES.map(t=>`<span class="type-chip type-${t}${filterTypes.has(t)?' active':''}" data-type="${t}">${t}</span>`).join('')}</div></div>
    <div id="results"></div>`;

  const schedule=()=>scheduleFilterRender();
  $('searchName').oninput=e=>{filterName=e.target.value.toLowerCase();schedule();};
  $('filterMove').oninput=e=>{filterMove=e.target.value;schedule();};
  $('filterAbility').oninput=e=>{filterAbility=e.target.value;schedule();};
  $('filterStatMin').oninput=e=>{filterStatMin=e.target.value;schedule();};
  $('filterPoints').onchange=e=>{filterPoints=e.target.value;renderResults();syncFilterControls();};
  $('filterStat').onchange=e=>{filterStat=e.target.value;renderResults();syncFilterControls();};

  document.querySelectorAll('[data-avail]').forEach(btn=>btn.onclick=()=>{filterAvail=btn.dataset.avail;renderResults();syncFilterControls();});
  document.querySelectorAll('[data-type]').forEach(chip=>chip.onclick=()=>{
    const t=chip.dataset.type;
    filterTypes.has(t)?filterTypes.delete(t):filterTypes.add(t);
    renderResults();syncFilterControls();
  });

  renderResults();
}

(async()=>{
  const ok = await enforceAccessGate();
  if(!ok) return;
  loadDexData();
  load().catch(e=>$("main").innerHTML=`<div class="empty">Could not load Free Agency: ${esc(String(e?.message||e))}</div>`);
  setInterval(()=>{if(!document.hidden)load().catch(()=>{});},5000);
})();
})();
