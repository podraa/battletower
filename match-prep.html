<style id="interactive-type-coverage-styles">
/* ==========================================================================
   Type Coverage — "Coverage Map" redesign.
   Two panels side by side: a type-coverage grid (what attacking types the
   selected Pokémon threatens with, glowing in that type's real colour when
   it lands a super-effective hit on the scouted team) and an opponent
   scouting grid (every opposing Pokémon, lit up when it's exploitable and
   dimmed to grayscale when it's safe). No move names anywhere — just the
   shape of the matchup.
   ========================================================================== */
.tc2{padding-top:20px}
.coverage-kicker{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:5px}

/* ---------- Header ---------- */
.tc2-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.tc2-head-text{min-width:0}
.tc2-head-text h2{margin:0 0 4px}
.coverage-analysis-select{min-width:230px}
.coverage-analysis-select label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);font-weight:800;margin-bottom:6px}
.coverage-analysis-select select{width:100%;height:40px;padding:0 14px;font-size:13px;font-weight:700;border-radius:10px}
.coverage-analysis-select select:hover{border-color:var(--amber)}

/* ---------- Selected Pokémon strip ---------- */
.tc2-mon-strip{display:flex;align-items:center;gap:14px;padding:14px 18px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(135deg,var(--panel-alt),var(--panel));margin-bottom:18px;position:relative;overflow:hidden}
.tc2-mon-strip::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0% 0%,rgba(185,154,255,.10),transparent 55%);pointer-events:none}
.tc2-mon-sprite{width:52px;height:52px;object-fit:contain;image-rendering:pixelated;flex:0 0 auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.tc2-mon-info{min-width:0;flex:1}
.tc2-mon-info strong{display:block;font-size:16px;line-height:1.2;margin-bottom:6px}
.tc2-mon-info .type-row{display:flex;gap:5px;flex-wrap:wrap}
.tc2-mon-metrics{display:flex;gap:20px;flex:0 0 auto}
.tc2-metric{text-align:right}
.tc2-metric b{display:block;font-family:var(--mono);font-size:20px;color:var(--amber);line-height:1.1}
.tc2-metric span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-top:3px;white-space:nowrap}

/* ---------- Best 4-type coverage (sits next to the sprite) ---------- */
.tc2-best-combo{display:flex;flex-direction:column;gap:6px;padding:8px 14px;border-left:1px dashed var(--border);flex:0 0 auto;min-width:0}
.tc2-best-combo-label{font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);font-weight:800;white-space:nowrap}
.tc2-best-combo-types{display:flex;flex-wrap:wrap;gap:4px}
.tc2-best-combo-types .type-pill{margin:0}
.tc2-best-combo-note{font-size:10px;color:var(--text-dim);font-family:var(--mono)}

/* ---------- Top 3 best types (sits above the type coverage grid) ---------- */
.tc2-top3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel-alt)}
.tc2-top3-label{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-dim);font-weight:800;white-space:nowrap}
.tc2-top3-list{display:flex;gap:8px;flex-wrap:wrap}
.tc2-top3-item{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border:1px solid var(--border);border-radius:999px;background:var(--panel)}
.tc2-top3-item .type-pill{margin:0}
.tc2-top3-rank{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--amber);color:var(--bg);font-family:var(--mono);font-size:9px;font-weight:900}
.tc2-top3-item:nth-child(2) .tc2-top3-rank{background:var(--teal)}
.tc2-top3-item:nth-child(3) .tc2-top3-rank{background:var(--text-dim)}
.tc2-top3-count{font-family:var(--mono);font-size:10px;color:var(--text-dim)}

/* ---------- Coverage map: two-panel layout ---------- */
.tc2-map{display:grid;grid-template-columns:minmax(220px,.72fr) minmax(0,1.6fr);gap:16px;align-items:start}
.tc2-panel{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:16px}
.tc2-panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tc2-panel-head span{font-size:12px;font-weight:800}
.tc2-panel-head em{font-style:normal;font-size:10px;color:var(--text-dim)}

/* ---------- Type coverage grid ---------- */
.tc2-type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tc2-type-chip{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--panel-alt);transition:transform .15s ease,box-shadow .15s ease}
.tc2-type-chip .type-pill{margin:0;font-size:9.5px}
.tc2-type-count{font-family:var(--mono);font-size:12px;font-weight:900;color:var(--bg);background:var(--text);border-radius:999px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.tc2-type-hot{border-color:transparent;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 6px 16px rgba(0,0,0,.28)}
.tc2-type-hot:hover{transform:translateY(-2px)}
.tc2-type-hot .tc2-type-count{background:var(--amber);color:var(--bg)}
.tc2-type-warm{opacity:.72}
.tc2-type-warm .tc2-type-count{display:none}
.tc2-type-cold{opacity:.32;filter:grayscale(.6)}
.tc2-type-cold .tc2-type-count{display:none}
.tc2-type-clickable{cursor:pointer}
.tc2-type-clickable:hover{filter:brightness(1.15)}
.tc2-type-clickable:active{transform:translateY(0) scale(.97)}

/* ---------- Type moves popup (reuses .switch-ev-modal/.switch-ev-card shell) ---------- */
.cov-moves-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.cov-move-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px 6px 7px;border:1px solid var(--border);border-radius:8px;background:var(--panel-alt);font-size:12px;line-height:1.2}
.cov-move-chip b{font-family:var(--mono);font-size:10px;color:var(--text-dim);font-weight:800}
.cov-move-cat{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:4px;font-size:9px;font-weight:900;background:var(--border);color:var(--text)}
.cov-move-physical .cov-move-cat{background:var(--amber);color:var(--bg)}
.cov-move-special .cov-move-cat{background:var(--teal);color:var(--bg)}

/* ---------- Opponent scouting grid ---------- */
.tc2-opp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tc2-opp-card{position:relative;border:1px solid var(--border);border-radius:14px;background:var(--panel-alt);padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;transition:transform .15s ease,border-color .15s ease}
.tc2-opp-card.tc2-opp-hit{border-color:var(--red);box-shadow:0 0 0 1px rgba(227,154,182,.18) inset,0 8px 20px rgba(227,154,182,.10)}
.tc2-opp-card.tc2-opp-hit:hover{transform:translateY(-3px)}
.tc2-opp-card.tc2-opp-safe{opacity:.5;filter:grayscale(.85)}
.tc2-opp-card.tc2-opp-safe:hover{opacity:.85;filter:grayscale(.4)}
.tc2-opp-sprite-wrap{position:relative;width:76px;height:76px;display:flex;align-items:center;justify-content:center}
.tc2-opp-sprite{width:72px;height:72px;object-fit:contain;image-rendering:pixelated}
.tc2-opp-name{font-size:13px;font-weight:800;line-height:1.25}
.tc2-opp-card .type-pill{margin:0;font-size:9.5px;padding:3px 8px}
.tc2-opp-hit-types{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:3px;padding-top:9px;border-top:1px dashed var(--border);width:100%}
.tc2-opp-hit-types .type-pill{font-size:9.5px;padding:3px 8px}
.tc2-opp-safe-label{font-size:9.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;font-weight:800;margin-top:3px}

.tc2-empty{padding:26px;text-align:center;color:var(--text-dim);font-size:12px}
.tc2[aria-busy="true"]{opacity:.55;pointer-events:none}

/* ---------- Responsive ---------- */
@media(max-width:900px){
  .tc2-map{grid-template-columns:1fr}
