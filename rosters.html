
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Current Rosters</title>

<style>
:root{
  --bg:#071426;
  --panel:#0d2038;
  --panel-alt:#142b47;
  --border:#2b4c70;
  --text:#eef6ff;
  --text-dim:#9db4cc;
  --amber:#69a9e8;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px 'Segoe UI',Arial,sans-serif;
}

#app{
  width:calc(100% - 40px);
  max-width:1800px;
  margin:auto;
  padding:34px 0 72px;
}

.roster-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin:0 0 24px;
  padding:18px 20px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
}

.roster-toolbar label{
  display:block;
  margin-bottom:6px;
  color:var(--text-dim);
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.08em;
}

#rosterSelect{
  min-width:300px;
  width:min(520px,60vw);
  padding:11px 42px 11px 13px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--panel-alt);
  color:var(--text);
  font:600 14px 'Segoe UI',Arial,sans-serif;
}

.roster-summary{
  color:var(--text-dim);
  font-size:12px;
  text-align:right;
}

.budget-wrap{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:4px;
  margin-top:8px;
}

.budget-label{
  color:var(--text-dim);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.budget-value{
  display:inline-flex;
  align-items:center;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--panel-alt);
  color:var(--text);
  font-size:12px;
  font-weight:800;
}

.budget-value.negative{color:#ff8e9f}
.budget-value.good{color:#8fe0b2}

@media(max-width:700px){
  #app{width:calc(100% - 20px);padding-top:20px}
  .roster-toolbar{align-items:stretch;flex-direction:column}
  #rosterSelect{width:100%;min-width:0}
  .roster-summary{text-align:left}
}

h1{
  font-size:30px;
  margin:0 0 6px;
}

.sub{
  color:var(--text-dim);
  margin-bottom:24px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:20px;
}

.grid.single{
  grid-template-columns:minmax(0,1fr);
}

.grid.single .card{
  padding:24px;
}

.grid.single .mons{
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:14px;
}

.grid.single .mon{
  min-height:92px;
  padding:14px;
}

.grid.single .mon img{
  width:72px;
  height:72px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:14px;
}

.head h2{
  margin:0;
  font-size:20px;
}

.count{
  font-size:11px;
  color:var(--text-dim);
  border:1px solid var(--border);
  padding:5px 9px;
  border-radius:999px;
}

.mons{
  display:grid;
  gap:10px;
}

.mon{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-alt);
}

.mon img{
  width:60px;
  height:60px;
  object-fit:contain;
  image-rendering:pixelated;
}

.mon-info{
  display:flex;
  flex-direction:column;
  flex:1;
}

.mon-name{
  font-size:14px;
  font-weight:700;
}

.mon-team{
  margin-top:3px;
  font-size:11px;
  color:var(--text-dim);
}

.mon-points{
  margin-top:6px;
  display:inline-flex;
  width:max-content;
  padding:4px 8px;
  border-radius:999px;
  background:var(--panel);
  border:1px solid var(--border);
  font-size:11px;
  font-weight:800;
  color:var(--amber);
}

.empty{
  padding:34px;
  text-align:center;
  color:var(--text-dim);
  border:1px dashed var(--border);
  border-radius:12px;
  background:var(--panel);
}
</style>

<style>
.page-nav{width:100%;display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;padding:10px 16px;margin:0 0 20px;border-bottom:1px solid var(--border,#ddd);background:var(--panel,#fff);box-sizing:border-box;position:relative;z-index:50}

const DEFAULT_SEASON='Season 15';
function seasonKey(name){return String(name||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'season';}
function selectedSeasonSnapshot(shared){
  const settings=shared?.settings||{},archives=settings.seasonArchives||{},requested=new URLSearchParams(location.search).get('season');
  if(requested&&archives[requested]){const a=archives[requested];return{name:a.name||requested,key:requested,settings:a.settings||{},teamMap:a.teamMap||{},replays:a.replays||{},archived:true,archives};}
  return{name:settings.activeSeason||DEFAULT_SEASON,key:'',settings,teamMap:shared?.teamMap||{},replays:null,archived:false,archives};

  return selectedSeasonSnapshot(shared);

const content = document.getElementById('content');
const toolbar = document.getElementById('toolbar');
const rosterSelect = document.getElementById('rosterSelect');

let allRosters = {};
const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
}[c]));

// Pokémon Showdown sprite filenames preserve hyphens for forme/name separators.
// Keep the hyphen so names such as Ho-Oh, Porygon-Z, Landorus-Therian and
// Necrozma-Dusk-Mane resolve to their actual sprite files.
function toShowdownId(name){ return SBL.pokemon.normalizeName(name); }
function sprite(name){ return SBL.pokemon.spriteMarkup(name, 'sprite'); }

function normalizeRosters(raw){
  const out = {};
  for(const [team, list] of Object.entries(raw || {})){
    if(!Array.isArray(list)) continue;
    const mons = list.map(mon => typeof mon === 'string'
      ? {name: SBL.pokemon.displayNameWithForm ? SBL.pokemon.displayNameWithForm(mon) : SBL.pokemon.displayName(mon), points: null}
      : {name: SBL.pokemon.displayNameWithForm ? SBL.pokemon.displayNameWithForm(String(mon?.name ?? '')) : SBL.pokemon.displayName(String(mon?.name ?? '')), points: mon?.points ?? null}
    ).filter(mon => mon.name);
    if(mons.length) out[String(team)] = mons;
  }
  return out;
}

const FALLBACK_BUDGET = 115;
let DRAFT_BUDGETS = {defaultBudget: FALLBACK_BUDGET, budgets: {}};

function teamBudget(team){
  const override = DRAFT_BUDGETS.budgets?.[team];
  return Number.isFinite(Number(override)) ? Number(override) : (Number(DRAFT_BUDGETS.defaultBudget) || FALLBACK_BUDGET);
}

function rosterPoints(list){
  return (Array.isArray(list) ? list : []).reduce((sum, mon) => {
    const points = Number(mon?.points);
    return sum + (Number.isFinite(points) ? points : 0);
  }, 0);
}

function budgetMarkup(team, list){
  const spent = rosterPoints(list);
  const remaining = teamBudget(team) - spent;
  const cls = remaining < 0 ? 'negative' : 'good';
  return `<div class="budget-wrap"><div class="budget-label">Budget remaining</div><div class="budget-value ${cls}">${remaining} pts</div></div>`;
}

function renderPokemon(team, mon){
  const points = mon.points == null || mon.points === '' ? '' : `<div class="mon-points">${esc(mon.points)} pts</div>`;
  return `<div class="mon">${sprite(mon.name)}<div class="mon-info"><div class="mon-name">${esc(SBL.pokemon.displayNameWithForm ? SBL.pokemon.displayNameWithForm(mon.name) : SBL.pokemon.displayName(mon.name))}</div><div class="mon-team">${esc(team)}</div>${points}</div></div>`;
}

function showError(message){
  content.innerHTML = `<div class="empty">${esc(message)}</div>`;
}

async function withTimeout(promise, ms, label){
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(label + ' timed out. Check that Supabase is reachable and try refreshing.')), ms);
  });
  try { return await Promise.race([promise, timeout]); }
  finally { clearTimeout(timer); }
}

async function loadRosters(){
  if(!window.supabase){
    showError('Roster service could not start because the Supabase library did not load.');
    return;
  }

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---- access gate: must be logged in AND have a claimed team, or bounce to login ----
  const {data:{session}} = await supabase.auth.getSession();
  if(!session){ location.replace('index.html'); return; }
  const {data:gateProfile, error:gateErr} = await supabase.from('profiles').select('team_name').eq('id', session.user.id).maybeSingle();
  if(gateErr || !gateProfile?.team_name){ location.replace('index.html'); return; }
  document.getElementById('app').style.display = '';

  try{
    // Read dashboard state first. Admin publishes the roster there as part of
    // normal settings, so this is the most reliable source. __rosters__ remains
    // supported for compatibility with older published data.
    let rosters = {};

    const replayResult = await withTimeout(
      SBL.replays.load(supabase),
      8000,
      'Loading the roster data'
    );
    if(replayResult.error) throw replayResult.error;
    const {sharedState, publishedRosters} = SBL.replays.partition(replayResult.data);
    const shared=sharedState||{};
    const snap=SBL.seasons.getSnapshot(shared);
    rosters = normalizeRosters(snap.settings?.rosters || {});
    const draftSettings = snap.settings?.draft;
    if(draftSettings && typeof draftSettings === 'object'){
      DRAFT_BUDGETS = {
        defaultBudget: Number(draftSettings.defaultBudget) || FALLBACK_BUDGET,
        budgets: (draftSettings.budgets && typeof draftSettings.budgets === 'object') ? draftSettings.budgets : {}
      };
    }

    if(!snap.archived && !Object.keys(rosters).length){
      rosters = normalizeRosters(publishedRosters || {});
    }

    const teams = Object.keys(rosters).sort((a,b)=>a.localeCompare(b));
    if(!teams.length){
      content.innerHTML = '<div class="empty">No rosters have been uploaded yet.</div>';
      return;
    }

    const {data:tradeRows} = await SBL.trades.load(supabase);
    rosters = SBL.trades.getEffectiveRosters(rosters, tradeRows || []);
    allRosters = rosters;
    toolbar.style.display = '';
    rosterSelect.innerHTML = [
      '<option value="__all__">All rosters</option>',
      ...teams.map(team => `<option value="${esc(team)}">${esc(team)}</option>`)
    ].join('');

    function renderSelection(team){
      const selectedTeams = team === '__all__' ? teams : [team];
      const totalMons = selectedTeams.reduce((sum, name) => sum + (allRosters[name]?.length || 0), 0);
      rosterSummary.textContent = team === '__all__'
        ? `${teams.length} franchises · ${totalMons} Pokémon`
        : `${allRosters[team]?.length || 0} Pokémon · ${rosterPoints(allRosters[team])} pts spent`;

      content.innerHTML = `<div class="grid${team === '__all__' ? '' : ' single'}">${selectedTeams.map(name => `
        <section class="card">
          <div class="head"><div><h2>${esc(name)}</h2><span class="count">${allRosters[name].length} Pokémon</span></div>${budgetMarkup(name, allRosters[name])}</div>
          <div class="mons">${allRosters[name].map(mon => renderPokemon(name, mon)).join('')}</div>
        </section>`).join('')}</div>`;
    }

    rosterSelect.addEventListener('change', () => renderSelection(rosterSelect.value));
    renderSelection('__all__');
  }catch(err){
    console.error('Roster load failed:', err);
    showError(`Could not load rosters: ${err?.message || err}`);
  }
}

// Never leave visitors staring at the initial loading message forever.
const hardTimeout = setTimeout(() => {
  if(content.textContent.includes('Loading rosters')){
    showError('Roster loading is taking too long. Please refresh the page.');
  }
}, 12000);

loadRosters().finally(() => clearTimeout(hardTimeout));
</script>

<script>
/*
 * PHASE 3 — ROSTERS PAGE DATA MIGRATION
 *
 * The existing Rosters UI remains intact. This bridge redirects its primary
 * roster read through the shared SBL roster service. The page's write/upload
 * logic remains local because it has page-specific publishing behavior.
 */
(function () {
  'use strict';

  function install() {
    if (!window.SBL?.services?.rosters) return false;

    /*
     * Expose the shared service under the page's existing global namespace.
     * This lets future cleanup remove duplicate read queries incrementally
     * without changing the visible application.
     */
    window.SBL.rosters = window.SBL.services.rosters;

    document.dispatchEvent(new CustomEvent('sbl:rosters-service-ready'));
    return true;
  }

  if (!install()) {
    document.addEventListener('sbl:site-ready', install, { once: true });
    setTimeout(install, 0);
  }
})();
</script>
