<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Room</title>
<style>
  :root{
    --bg:#0e1218;
    --panel:#161c26;
    --panel-alt:#1c2432;
    --border:#2a3444;
    --text:#e8edf5;
    --text-dim:#8996a8;
    --amber:#ffb454;
    --amber-text:#1a1206;
    --teal:#5eead4;
    --red:#ff7a7a;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased;}
  #app{max-width:1320px; margin:0 auto; padding:24px 20px 60px;}
  header{margin-bottom:16px;}
  h1{font-size:22px; margin:0 0 2px;}
  .sub{color:var(--text-dim); font-size:13px; margin-bottom:16px;}

  .panel{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px;}
  .panel + .panel{margin-top:14px;}
  .panel h2{font-size:14px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);}
  label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
  input[type=text], input[type=email], input[type=password], select{
    width:100%; background:var(--panel-alt); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:10px 12px; font-family:var(--sans); font-size:13px;
  }
  .row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  .row > div{flex:1; min-width:160px;}
  button.primary{background:var(--amber); color:var(--amber-text); border:none; border-radius:8px; padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer; font-family:var(--sans);}
  button.primary:disabled{opacity:.5; cursor:default;}
  button.ghost{background:none; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:9px 14px; font-size:12px; cursor:pointer; font-family:var(--sans);}
  button.ghost:hover{border-color:var(--amber);}
  button.small{padding:5px 10px; font-size:11px;}
  .danger-btn{border-color:var(--red); color:var(--red);}
  .foot-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .note{font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5;}
  .note.danger{color:var(--red);}
  .empty-state{color:var(--text-dim); font-size:13px; padding:20px 0; text-align:center;}
  .badge{display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px; background:var(--panel-alt); border:1px solid var(--border); color:var(--text-dim); margin-right:6px;}

  .clock-banner{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .clock-banner .who{font-size:20px; font-weight:800;}
  .clock-banner .who .amber{color:var(--amber);}
  .clock-banner .pickno{font-family:var(--mono); color:var(--text-dim); font-size:13px;}

  .budget-strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px;}
  .budget-chip{flex:0 0 auto; min-width:150px; background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
  .budget-chip.oc{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset;}
  .budget-chip .team{font-weight:700; font-size:13px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .budget-chip .amt{font-family:var(--mono); font-size:15px;}
  .budget-chip .amt.neg{color:var(--red);}
  .budget-chip .amt.pos{color:var(--teal);}

  .pool-toolbar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap;}
  .pool-toolbar input{flex:1; min-width:200px;}
  .tier-block{margin-bottom:16px;}
  .tier-title{font-size:12px; font-weight:700; color:var(--amber); margin:0 0 8px; text-transform:uppercase; letter-spacing:.06em;}
  .mon-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
  .mon-card{
    display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px;
    border:1px solid var(--border); border-radius:10px; background:var(--panel-alt);
    cursor:pointer; text-align:center;
  }
  .mon-card:hover{border-color:var(--amber);}
  .mon-card.taken{opacity:.4; cursor:default;}
  .mon-card.taken:hover{border-color:var(--border);}
  .mon-card img{width:56px; height:56px; object-fit:contain; image-rendering:pixelated;}
  .mon-card .name{font-size:12px; font-weight:700;}
  .mon-card .pts{font-size:11px; color:var(--amber); font-family:var(--mono);}
  .mon-card .taken-to{font-size:10px; color:var(--text-dim);}

  .overlay{position:fixed; inset:0; background:rgba(6,9,14,.7); display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;}
  .overlay-box{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:20px; max-width:420px; width:100%;}
  .overlay-box h3{margin:0 0 4px; font-size:16px;}
  .overlay-box .pts{color:var(--amber); font-family:var(--mono); margin-bottom:14px;}

  .page-nav{position:fixed;top:14px;right:18px;z-index:1000;display:flex;align-items:center;gap:7px}
  .page-nav label{font-size:11px;color:var(--text-dim);font-weight:700}
  .page-nav select{font:inherit;font-size:12px;padding:7px 30px 7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .page-nav select:disabled{opacity:.45;cursor:not-allowed}
  .page-nav .lock-hint{font-size:10.5px;color:var(--text-dim);opacity:.85}
  @media(max-width:700px){.page-nav{top:8px;right:8px}.page-nav label{display:none}.page-nav .lock-hint{display:none}}
</style>

.myteam-budget,

.standings-row:hover{

}

/* Team cards previously had a hard-coded dark gradient. */
.team-card{background:var(--sbl-card-bg) !important;}

/* Secondary surfaces */
.mon,
.mon-pill,

.chip,

/* Theme-aware headings and ordinary text. */
.panel h1,.panel h2,.panel h3,.panel h4,
.card h1,.card h2,.card h3,.card h4,
.team-card-name,.team-card-sub,
.team-name,.team-record,.death-cause-title,

<style id="sbl-final-theme-ui-fix">
/* Final site-wide theme normalization.  All surfaces and semantic text use
   the active theme variables; fixed type colors remain intentionally untouched. */
html,body{background:var(--bg)!important;color:var(--text)!important}

/* Common surfaces */
.panel,.card,.set-card,.statbox,.notice,.team-card,.overview-card,
.franchise-card,.pokemon-card,.roster-card,.free-agent-card,.fa-card,
.team-analysis-card,.prep-opponent-card,.prep-switch-card,.switch-card-detail,
.speed-detail-card,.speed-matrix-wrap,.damage-calc-card,.damage-calc-side,
.damage-calc-grid,.myteam-card,.myteam-panel,.next-battle-card,
.budget-card,.replay-summary-box,.modalbox,.modal-card,.pokemon-modal,
.pokemon-profile,.conference-block,.fixture-match,.fixture-week,
.trade-col,.selected-chip,#tradeSummary,#proposePanel,
.showdown-import-card,.showdown-saved-item{
  color:var(--text);
  background-color:var(--panel);
  border-color:var(--border);
}

/* Secondary surfaces */
.mon,.mon-pill,.pick-card,.chip,.badge,.speed-pin-chip,
.meta-box,.profile-record-tab,.profile-grid>div,.speed-detail-card,
.dc-move-group,.dc-result-move,.dc-result-damage,.showdown-import-text,
.showdown-saved-actions button{
  color:var(--text);
  background-color:var(--panel-alt);
  border-color:var(--border);
}

/* Headings and ordinary labels must contrast on every theme. */
h1,h2,h3,h4,h5,h6,
.panel h1,.panel h2,.panel h3,.panel h4,
.card h1,.card h2,.card h3,.card h4,
.team-card-name,.franchise-card-title,.pokemon-name,
.pokemon-modal-head strong,.pokemon-profile h2,.pokemon-profile h3,
.speed-matrix th,.speed-matrix tbody th,
.damage-calc-card h2,.damage-calc-card h3{
  color:var(--text)!important;
}

.note,.small,.muted,.sub,.meta,.stat-label,
.speed-condition-title,.speed-detail-card label,
.switch-card-detail,.switch-card-evs,.dc-results-subheading,
.dc-auto-status,.prep-card-section>span{
  color:var(--text-dim)!important;
}

/* Inputs */
input,textarea,select{
  background:var(--panel-alt)!important;
  color:var(--text)!important;
  border-color:var(--border)!important;
}

/* Team overview / roster cards: never retain a dark-only gradient. */
.team-card,.overview-card,.franchise-card,.pokemon-card,.roster-card,
.free-agent-card,.team-analysis-card,.prep-opponent-card{
  background:var(--panel)!important;
}

/* Pokémon profile modal header must follow the active theme. */
.pokemon-modal-head{
  background:color-mix(in srgb,var(--panel) 96%,transparent)!important;
  color:var(--text)!important;
  border-bottom-color:var(--border)!important;
}

/* Switch-in analyser: the raw-damage detail belongs to the same card. */
#switchResults .switch-card-detail,
.prep-switch-card .switch-card-detail{
  background:transparent!important;
  color:var(--text-dim)!important;
  border-color:transparent!important;
}

/* Speed matrix: softer, theme-derived status cells. */
.speed-cell{background:var(--panel)!important;border-color:var(--border)!important;color:var(--text)!important}
.speed-cell.speed-faster{
  background:color-mix(in srgb,var(--teal) 12%,var(--panel))!important;
  border-color:color-mix(in srgb,var(--teal) 42%,var(--border))!important;
  color:var(--teal)!important;
}
.speed-cell.speed-slower{
  background:color-mix(in srgb,var(--red) 10%,var(--panel))!important;
  border-color:color-mix(in srgb,var(--red) 38%,var(--border))!important;

}
.speed-cell.speed-tie{
  background:color-mix(in srgb,var(--amber) 10%,var(--panel))!important;
  border-color:color-mix(in srgb,var(--amber) 38%,var(--border))!important;

}

/* Roster budget */
.budget-value.good{color:var(--teal)!important}
.budget-value.negative{color:var(--red)!important}

/* Positive / negative semantic values */

.result-win,.win-text,.fixture-result,.fixture-summary,

<div id="app">
  <header>
    <h1>Draft Room</h1>
    <div class="sub">Make picks live. Every pick updates budgets and published rosters immediately. <span id="seasonLabel" class="badge">Current season</span></div>
  </header>
  <div id="content"></div>

<script src="js/sbl-site.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/pokemon-dex-ids.js"></script>
<script src="js/services/pokemon.js"></script>
<script src="js/sbl-supabase.js"></script>
<script src="js/services/admin.js"></script>
<script>
(function(){
  const supabase = SBL.getSupabase();
  const SUPABASE_STATE_ID = SBL.admin.STATE_ID;

  let adminUser = null;
  let STATE = { teamMap:{}, settings:{ rosters:{}, draft:null } };
  let PROFILES = [];
  let loaded = false;
  let poolFilter = '';
  const contentEl = document.getElementById('content');

  const esc = s => String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

  function requireAdmin(){ if(!adminUser) throw new Error('Admin login required to make picks.'); }

  function defaultDraftState(){
    return { status:'setup', mode:'manual', defaultBudget:120, budgets:{}, pool:[], order:[], currentPick:0, picks:[], updatedAt:null };
  }
  function normalizeDraftState(draft){
    const d = Object.assign(defaultDraftState(), draft || {});
    d.budgets = d.budgets && typeof d.budgets === 'object' ? d.budgets : {};
    d.pool = Array.isArray(d.pool) ? d.pool.map(m => ({
      id: String(m?.id ?? ''), name: (SBL.pokemon.displayNameWithForm ? SBL.pokemon.displayNameWithForm(String(m?.name ?? '').trim()) : SBL.pokemon.displayName(String(m?.name ?? '').trim())), points: Number(m?.points) || 0,
      drafted: !!m?.drafted, draftedBy: m?.draftedBy || null, pickNumber: m?.pickNumber ?? null
    })).filter(m => m.id && m.name) : [];
    d.order = Array.isArray(d.order) ? d.order.map(String) : [];
    d.picks = Array.isArray(d.picks) ? d.picks : [];
    d.currentPick = Number.isFinite(Number(d.currentPick)) ? Number(d.currentPick) : 0;
    if(d.status !== 'live' && d.status !== 'complete') d.status = 'setup';
    if(d.mode !== 'ordered') d.mode = 'manual';
    return d;
  }
  function normalizeStoredRosters(rosters){
    const out = {};
    for(const [team, list] of Object.entries(rosters || {})){
      out[team] = (Array.isArray(list) ? list : []).map(mon => typeof mon === 'string'
        ? {name:(SBL.pokemon.displayNameWithForm ? SBL.pokemon.displayNameWithForm(mon) : SBL.pokemon.displayName(mon)), points:null}
        : {name:(SBL.pokemon.displayNameWithForm ? SBL.pokemon.displayNameWithForm(String(mon?.name ?? '')) : SBL.pokemon.displayName(String(mon?.name ?? ''))), points:mon?.points ?? null}
      ).filter(mon => mon.name);
    }
    return out;
  }

  async function loadState(){
    // The Draft Room must be able to READ the published draft board before
    // authentication is considered.  In particular, a profiles/RLS failure
    // must never prevent an otherwise valid live draft from rendering.
    const {data, error} = await supabase
      .from('replays')
      .select('replay_id,replay_data')
      .eq('replay_id', SUPABASE_STATE_ID)
      .maybeSingle();
    if(error) throw error;

    const shared = data?.replay_data || {};
    STATE.teamMap = shared.teamMap || {};
    STATE.settings = Object.assign({rosters:{}}, shared.settings || {});
    STATE.settings.rosters = normalizeStoredRosters(STATE.settings.rosters);
    STATE.settings.draft = normalizeDraftState(STATE.settings.draft);
    const seasonLabel=document.getElementById('seasonLabel'); if(seasonLabel) seasonLabel.textContent=STATE.settings.activeSeason || 'Current season';
    // Profiles are supplementary only. They are commonly protected by RLS,
    // so failure here is deliberately non-fatal. Franchises are also derived
    // from the published draft order/team map below.
    try{
      const {data:profilesData} = await supabase
        .from('profiles')
        .select('id,team_name,status')
        .eq('status','approved');
      PROFILES = (profilesData || []).filter(p => p.team_name);
    }catch(profileError){
      console.warn('Draft Room: approved profile lookup unavailable; continuing from published draft state.', profileError);
      PROFILES = [];
    }
    loaded = true;
  }

  async function saveSharedState(){ requireAdmin(); await SBL.admin.saveSharedState(STATE, adminUser); }
  async function savePublishedRosters(){ requireAdmin(); await SBL.admin.savePublishedRosters(STATE.settings.rosters || {}, adminUser); }
  async function persist(){ requireAdmin(); await SBL.admin.persistDraft(STATE, adminUser); }

  function franchises(){
    const fromProfiles = PROFILES.map(p => p.team_name);
    const fromOrder = STATE.settings.draft.order || [];
    const fromRosters = Object.keys(STATE.settings.rosters || {});
    const map = STATE.teamMap || {};
    const fromTeamMap = [
      ...Object.keys(map),
      ...Object.values(map).map(v => typeof v === 'string' ? v : v?.team_name)
    ].filter(Boolean);
    return [...new Set([...fromProfiles, ...fromOrder, ...fromRosters, ...fromTeamMap])].sort();
  }
  function draftBudget(team){
    const d = STATE.settings.draft;
    const b = d.budgets[team];
    return Number.isFinite(Number(b)) ? Number(b) : Number(d.defaultBudget) || 0;
  }
  function draftSpent(team){
    return STATE.settings.draft.picks.filter(p => p.team === team).reduce((s,p) => s + (Number(p.points) || 0), 0);
  }
  function currentTeam(){
    const d = STATE.settings.draft;
    if(d.mode !== 'ordered') return null;
    return d.order[d.currentPick] || null;
  }

  // ---------- sprites ----------
  function spriteCandidates(name){ return SBL.pokemon.candidateIds(name); }
  function spriteUrl(name){ return SBL.pokemon.spriteUrl(name); }

  // ---------- pick flow ----------
  async function makePick(mon, team){
    requireAdmin();
    const d = STATE.settings.draft;
    mon.drafted = true;
    mon.draftedBy = team;
    mon.pickNumber = d.picks.length + 1;
    d.picks.push({poolId: mon.id, name: mon.name, points: mon.points, team, pickNumber: mon.pickNumber, ts: new Date().toISOString()});
    STATE.settings.rosters[team] = STATE.settings.rosters[team] || [];
    STATE.settings.rosters[team].push({name: mon.name, points: mon.points});
    if(d.mode === 'ordered'){
      d.currentPick += 1;
      if(d.currentPick >= d.order.length) d.status = 'complete';
    }
    d.updatedAt = new Date().toISOString();
    await persist();
  }

  async function undoLastPick(){
    requireAdmin();
    const d = STATE.settings.draft;
    const last = d.picks.pop();
    if(!last) return;
    const mon = d.pool.find(m => m.id === last.poolId);
    if(mon){ mon.drafted = false; mon.draftedBy = null; mon.pickNumber = null; }
    const list = STATE.settings.rosters[last.team] || [];
    const idx = [...list].reverse().findIndex(m => m.name === last.name && m.points === last.points);
    if(idx >= 0) list.splice(list.length - 1 - idx, 1);
    if(d.mode === 'ordered' && d.currentPick > 0) d.currentPick -= 1;
    if(d.status === 'complete') d.status = 'live';
    d.updatedAt = new Date().toISOString();
    await persist();
  }

  // ---------- render ----------
  function render(){
    if(!loaded){ contentEl.innerHTML = `<div class="empty-state">Loading…</div>`; return; }
    const d = STATE.settings.draft;

    if(d.status === 'setup'){
      contentEl.innerHTML = `<div class="panel">
        <h2>Draft not started</h2>
        <div class="note">Set up the draft board, budgets, and order in the Admin Dashboard's Draft tab, then start the draft from there.</div>
        <div class="foot-actions"><a class="ghost" href="admin.html" style="text-decoration:none;display:inline-flex;align-items:center;">Go to Admin Dashboard ↗</a></div>
      </div>`;
      return;
    }

    const teams = franchises();
    const oc = currentTeam();
    const filtered = d.pool.filter(m => !poolFilter || m.name.toLowerCase().includes(poolFilter.toLowerCase()));
    const groups = {};
    filtered.forEach(m => { (groups[m.points] ??= []).push(m); });
    const tiers = Object.keys(groups).map(Number).sort((a,b) => b - a);

    contentEl.innerHTML = `
      <div class="panel">
        <div class="clock-banner">
          <div>
            ${d.status === 'complete'
              ? `<div class="who">Draft complete</div>`
              : d.mode === 'ordered'
                ? `<div class="who">On the clock: <span class="amber">${oc ? esc(oc) : '—'}</span></div><div class="pickno">Pick #${d.currentPick + 1} of ${d.order.length}</div>`
                : `<div class="who">Manual mode</div><div class="pickno">Pick a Pokémon, then choose the franchise</div>`}
          </div>
          <div class="foot-actions" style="margin-top:0">
            ${d.picks.length ? `<button class="ghost danger-btn" id="undoBtn">Undo last pick</button>` : ''}
            <a class="ghost" href="admin.html" style="text-decoration:none;display:inline-flex;align-items:center;">Draft setup ↗</a>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Budgets</h2>
        <div class="budget-strip">
          ${teams.length ? teams.map(t => {
            const spent = draftSpent(t), budget = draftBudget(t), remain = budget - spent;
            return `<div class="budget-chip ${t === oc ? 'oc' : ''}">
              <div class="team">${esc(t)}</div>
              <div class="amt ${remain < 0 ? 'neg' : 'pos'}">${remain} / ${budget} pts</div>
            </div>`;
          }).join('') : '<div class="empty-state">No approved franchises found.</div>'}
        </div>
      </div>

      <div class="panel">
        <h2>Draft board</h2>
        <div class="pool-toolbar">
          <input type="text" id="poolSearch" placeholder="Search Pokémon…" value="${esc(poolFilter)}">
          <span class="badge">${d.pool.filter(m=>!m.drafted).length} available</span>
          <span class="badge">${d.pool.filter(m=>m.drafted).length} drafted</span>
        </div>
        ${tiers.length ? tiers.map(pts => `
          <div class="tier-block">
            <div class="tier-title">${pts} points</div>
            <div class="mon-grid">
              ${groups[pts].sort((a,b)=>a.name.localeCompare(b.name)).map(m => `
                <div class="mon-card ${m.drafted ? 'taken' : ''}" ${m.drafted ? '' : `data-pick="${esc(m.id)}"`}>
                  ${SBL.pokemon.spriteMarkup(m.name, 'sprite')}
                  <div class="name">${esc(SBL.pokemon.displayName(m.name))}</div>
                  <div class="pts">${m.points} pts</div>
                  ${m.drafted ? `<div class="taken-to">→ ${esc(m.draftedBy || '')}</div>` : ''}
                </div>`).join('')}
            </div>
          </div>`).join('') : '<div class="empty-state">No Pokémon match your search.</div>'}
      </div>
    `;

    document.getElementById('undoBtn')?.addEventListener('click', async () => {
      if(!confirm('Undo the most recent pick? This removes it from the board, budgets, and the roster.')) return;
      try{ await undoLastPick(); render(); }
      catch(e){ alert(e.message); }
    });
    document.getElementById('poolSearch')?.addEventListener('input', (e) => {
      poolFilter = e.target.value;
      render();
      document.getElementById('poolSearch')?.focus();
    });
    contentEl.querySelectorAll('[data-pick]').forEach(card => {
      card.addEventListener('click', () => openPickModal(card.dataset.pick));
    });
  }

  function openPickModal(monId){
    const d = STATE.settings.draft;
    const mon = d.pool.find(m => m.id === monId);
    if(!mon || mon.drafted) return;
    const teams = franchises();
    const oc = currentTeam();
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="overlay-box">
      <h3>${esc(SBL.pokemon.displayName(mon.name))}</h3>
      <div class="pts">${mon.points} points</div>
      <label>Assign to franchise</label>
      <select id="pickTeamSelect">
        ${teams.map(t => `<option value="${esc(t)}" ${t === oc ? 'selected' : ''}>${esc(t)}${t===oc?' (on the clock)':''}</option>`).join('')}
      </select>
      <div class="note" id="pickBudgetNote"></div>
      <div class="foot-actions">
        <button class="primary" id="confirmPickBtn">Confirm pick</button>
        <button class="ghost" id="cancelPickBtn">Cancel</button>
      </div>
      <div class="note danger" id="pickErr"></div>
    </div>`;
    document.body.appendChild(overlay);

    const sel = overlay.querySelector('#pickTeamSelect');
    const note = overlay.querySelector('#pickBudgetNote');
    function updateNote(){
      const t = sel.value;
      const remain = draftBudget(t) - draftSpent(t);
      note.textContent = `${t} has ${remain} pts remaining before this pick.` + (remain - mon.points < 0 ? ' This pick would put them over budget.' : '');
      note.className = 'note' + (remain - mon.points < 0 ? ' danger' : '');
    }
    sel?.addEventListener('change', updateNote);
    updateNote();

    overlay.querySelector('#cancelPickBtn').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.remove(); });
    overlay.querySelector('#confirmPickBtn').addEventListener('click', async () => {
      const err = overlay.querySelector('#pickErr');
      const team = sel.value;
      if(!team){ err.textContent = 'Choose a franchise.'; return; }
      try{
        await makePick(mon, team);
        overlay.remove();
        render();
      }catch(e){ err.textContent = e.message; }
    });
  }

  // ---------- auth ----------
  function showAdminError(msg){
    let el = document.getElementById('adminError');
    if(!el){
      el = document.createElement('div');
      el.id = 'adminError';
      el.style.cssText = [
        'position:relative', 'z-index:2000', 'margin:14px 0', 'max-width:none',
        'padding:12px 14px', 'border:1px solid var(--red)', 'border-radius:8px',
        'background:var(--panel)', 'color:var(--red)', 'font-size:12px',
        'line-height:1.5', 'white-space:pre-wrap'
      ].join(';');
      const app = document.getElementById('app');
      const header = app?.querySelector('header');
      if(header?.parentNode) header.parentNode.insertBefore(el, header.nextSibling);
      else document.body.prepend(el);
    }
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function refreshAuth(){
    try{
      const {data, error} = await supabase.auth.getSession();
      if(error) throw error;
      adminUser = data?.session?.user || null;
    }catch(e){
      // Authentication is for write actions only. A session lookup failure
      // must not prevent the public draft board from loading.
      console.warn('Draft Room auth check failed; continuing read-only.', e);
      adminUser = null;
    }
  }

  // Boot is intentionally independent of auth. A live published draft should
  // render even when the visitor is logged out; login is only needed to pick.
  (async function init(){
    contentEl.innerHTML = '<div class="empty-state">Loading draft board…</div>';
    try{
      await loadState();
      await refreshAuth();
      render();
    }catch(e){
      console.error('Draft Room boot failed:', e);
      showAdminError('Could not load the Draft Room.\n' + (e?.message || String(e)));
      contentEl.innerHTML = '<div class="empty-state">The Draft Room could not load. See the error above.</div>';
    }

    supabase.auth.onAuthStateChange((_event, session) => {
      adminUser = session?.user || null;
      // Do not reload the board on auth events. Authentication only changes
      // whether write actions are available.
      if(loaded) render();
    });
  })();
})();
</script>
<script>
(function(){
  const select = document.getElementById('pageNavSelect');
  if(!select) return;
  const lockHint = document.getElementById('pageNavLockHint');
  const ADMIN = 'admin.html';
  const current = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  if(current === 'draft.html') select.value = 'draft.html';
  else if(Array.from(select.options).some(o => o.value === current)) select.value = current;

  function lockNav(locked){
    select.disabled = locked;
    select.title = locked ? 'Log in to switch pages' : '';
    if(lockHint) lockHint.hidden = !locked;
  }

  const client = window.SBL?.getSupabase ? window.SBL.getSupabase() : null;

  async function setupCommissionerNav(){
    try{
      if(!client){ lockNav(true); return; }
      const {data:{session}} = await client.auth.getSession();
      lockNav(!session?.user);
      if(!session?.user) return;
      const {data:profile, error} = await client.from('profiles').select('is_commissioner').eq('id', session.user.id).maybeSingle();
      if(error) throw error;
      if(profile?.is_commissioner){
        select.querySelectorAll('option[data-admin-only]').forEach(opt => { opt.hidden = false; });
      }
      if(current === ADMIN) select.value = ADMIN;
    }catch(err){ console.warn('Commissioner navigation check failed:', err); lockNav(true); }
  }

  select.addEventListener('change', e => { if(e.target.value) location.href = e.target.value; });
  setupCommissionerNav();
  client?.auth.onAuthStateChange((_event, session) => { lockNav(!session?.user); });
})();
</script>

  <script src="js/auth.js"></script>
  <script src="js/services/rosters.js"></script>
</body>
