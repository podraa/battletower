<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Draft Room</title>
<style>
:root{--bg:#0e1218;--panel:#161c26;--panel-alt:#1c2432;--border:#2a3444;--text:#e8edf5;--text-dim:#8996a8;--amber:#ffb454;--amber-text:#1a1206;--teal:#5eead4;--red:#ff7a7a;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;--mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}#app{max-width:1320px;margin:0 auto;padding:72px 20px 60px}h1{font-size:22px;margin:0 0 2px}.sub{color:var(--text-dim);font-size:13px;margin-bottom:16px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px}.panel+.panel{margin-top:14px}.panel h2{font-size:14px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim)}.note{font-size:12px;color:var(--text-dim);margin-top:10px;line-height:1.5}.note.danger{color:var(--red)}.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;background:var(--panel-alt);border:1px solid var(--border);color:var(--text-dim);margin-right:6px}.clock{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.clock .who{font-size:20px;font-weight:800}.amber{color:var(--amber)}.pickno{font-family:var(--mono);color:var(--text-dim);font-size:13px}.budget-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}.budget-chip{flex:0 0 auto;min-width:150px;background:var(--panel-alt);border:1px solid var(--border);border-radius:10px;padding:10px 12px}.budget-chip.mine{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}.budget-chip .team{font-weight:700;font-size:13px;margin-bottom:4px}.budget-chip .amt{font-family:var(--mono);font-size:15px}.pos{color:var(--teal)}.neg{color:var(--red)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-size:13px}.tier{margin-bottom:16px}.tier-title{font-size:12px;font-weight:700;color:var(--amber);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.mon{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--panel-alt);cursor:pointer;text-align:center}.mon:hover{border-color:var(--amber)}.mon.disabled{opacity:.42;cursor:default}.mon img{width:56px;height:56px;object-fit:contain;image-rendering:pixelated}.mon .name{font-size:12px;font-weight:700}.mon .pts{font-size:11px;color:var(--amber);font-family:var(--mono)}.mon .taken{font-size:10px;color:var(--text-dim)}button{font-family:var(--sans)}button.primary{background:var(--amber);color:var(--amber-text);border:0;border-radius:8px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer}button.primary:disabled{opacity:.5;cursor:default}.ghost{background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 14px;font-size:12px;cursor:pointer}.ghost:hover{border-color:var(--amber)}.empty{color:var(--text-dim);font-size:13px;padding:22px;text-align:center}.errorbox{border:1px solid var(--red);background:rgba(255,122,122,.06);border-radius:10px;padding:14px;margin-top:14px}.errorbox strong{color:var(--red)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.overlay{position:fixed;inset:0;background:rgba(6,9,14,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:2000}.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;max-width:430px;width:100%}.modal h3{margin:0 0 4px}.modal select{width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px}.modal input{width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px}
</style>
<script src="js/sbl-themes.js?v=20260823-themes2" defer></script><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>

.roster-draft-row span:last-child{color:var(--text-dim);font-size:12px}
.budget-chip.mine{max-width:360px}
</style>
