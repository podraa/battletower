<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Admin Dashboard</title>
<style>
  :root{
    --bg:#0e1218;
    --panel:#161c26;
    --panel-alt:#1c2432;
    --border:#2a3444;
    --text:#e8edf5;
    --text-dim:#8996a8;
    --amber:#ffb454;
    --amber-text:#1a1206;
    --teal:#5eead4;
    --red:#ff7a7a;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1080px; margin:0 auto; padding:24px 20px 60px;}

  /* header + ticker */
  header{margin-bottom:20px;}
  h1{font-size:22px; margin:0 0 2px; letter-spacing:.2px;}
  .sub{color:var(--text-dim); font-size:13px; margin-bottom:16px;}
  .ticker{
    display:flex; gap:0; overflow-x:auto; border:1px solid var(--border);
    border-radius:10px; background:linear-gradient(180deg,var(--panel-alt),var(--panel));
  }
  .tick{
    flex:1 0 140px; padding:12px 16px; border-right:1px solid var(--border);
    min-width:140px;
  }
  .tick:last-child{border-right:none;}
  .tick .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);}
  .tick .name{font-size:13px; margin:2px 0 4px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tick .val{font-family:var(--mono); font-size:19px; color:var(--amber);}
  .tick.empty .val{color:var(--text-dim); font-size:13px;}

  /* tabs */
  nav.tabs{display:flex; gap:4px; margin:20px 0 16px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  nav.tabs button{
    background:none; border:none; color:var(--text-dim); padding:10px 14px;
    font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent;
    font-family:var(--sans);
  }
  nav.tabs button.active{color:var(--text); border-bottom-color:var(--amber);}
  nav.tabs button:hover{color:var(--text);}

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px;
  }
  .panel + .panel{margin-top:14px;}
  .panel h2{font-size:14px; margin:0 0 12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim);}

  label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
  textarea, input[type=text]{
    width:100%; background:var(--panel-alt); border:1px solid var(--border); border-radius:8px;
    color:var(--text); padding:10px 12px; font-family:var(--mono); font-size:13px;
  }
  textarea{min-height:90px; resize:vertical;}
  .row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px;}
  .row > div{flex:1; min-width:160px;}

  button.primary{
    background:var(--amber); color:var(--amber-text); border:none; border-radius:8px;
    padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer; font-family:var(--sans);
  }
  button.primary:disabled{opacity:.5; cursor:default;}
  button.ghost{
    background:none; border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:9px 14px; font-size:12px; cursor:pointer; font-family:var(--sans);
  }
  button.ghost:hover{border-color:var(--amber);}
  button.small{padding:5px 10px; font-size:11px;}
  .danger-btn{border-color:var(--red); color:var(--red);}

  .log{font-family:var(--mono); font-size:12px; white-space:pre-wrap; color:var(--text-dim); margin-top:10px; line-height:1.6;}
  .log .ok{color:var(--teal);}
  .log .err{color:var(--red);}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-dim); padding:8px 10px; border-bottom:1px solid var(--border);
  }
  td{padding:8px 10px; border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  td.num, th.num{text-align:right; font-family:var(--mono);}
  .trade-limit-input{width:72px;background:var(--panel-alt);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 7px;font-family:var(--mono);}
  .rank{color:var(--text-dim); font-family:var(--mono); width:26px;}
  .pname{font-weight:600;}
  .dealt{color:var(--amber);}
  .taken{color:var(--red);}
  .kills{color:var(--teal);}

  select{
    background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
    padding:8px 10px; border-radius:8px; font-family:var(--sans); font-size:13px;
  }
  .foot-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .note{font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5;}
  .map-row{display:flex; gap:10px; align-items:center; margin-bottom:8px;}
  .map-row input{flex:1;}
  .badge{
    display:inline-block; font-size:10px; padding:2px 7px; border-radius:20px;
    background:var(--panel-alt); border:1px solid var(--border); color:var(--text-dim); margin-left:6px;
  }
  .update-badge-league{border-color:var(--amber); color:var(--amber);}
  .update-badge-schedule{border-color:var(--teal); color:var(--teal);}
  .update-badge-rules{border-color:var(--red); color:var(--red);}
  .update-badge-site{border-color:#9aa8ff; color:#9aa8ff;}
  .update-row{gap:14px;}

  /* sprites */
  .sprite{
    width:48px; height:48px; object-fit:contain; vertical-align:middle;
    image-rendering:pixelated; background:var(--panel-alt); border-radius:8px; margin-right:10px;
  }
  .sprite-xl{
    width:64px; height:64px; object-fit:contain; vertical-align:middle;
    image-rendering:pixelated; background:var(--panel-alt); border-radius:10px; margin-right:12px;
  }
  .pname-cell{display:flex; align-items:center;}

  /* wide layout (Leaderboards / Golden Fist / Franchise Stats) */
  #app.wide{max-width:1440px;}
  .wide .panel{padding:26px;}
  .wide table{font-size:15px;}
  .wide th{font-size:11px; padding:10px 12px;}
  .wide td{padding:12px;}

  .nav-link{
    display:inline-block; color:var(--teal); text-decoration:none; font-size:13px;
    font-weight:600; cursor:pointer; margin-top:4px;
  }
  .nav-link:hover{text-decoration:underline;}
  .section-divider{height:1px; background:var(--border); margin:18px 0;}

  #globalTable{overflow-x:auto;}
  #globalTable table{min-width:620px;}

  /* golden fist */
  .gf-list{display:flex; flex-direction:column; gap:8px;}
  .gf-row{
    display:flex; align-items:center; gap:14px; padding:10px 14px; border-radius:10px;
    background:var(--panel-alt); border:1px solid var(--border);
  }
  .gf-row.top1{border-color:#ffd166; box-shadow:0 0 0 1px #ffd16655 inset;}
  .gf-row.top2{border-color:#c9c9c9;}
  .gf-row.top3{border-color:#cd7f32;}
  .gf-row.auditable-row{cursor:pointer;}
  .gf-row.auditable-row:hover{border-color:var(--amber);}
  .gf-rank{font-family:var(--mono); font-size:16px; width:28px; color:var(--text-dim); text-align:center;}
  .gf-row.top1 .gf-rank{color:#ffd166;}
  .gf-row.top2 .gf-rank{color:#c9c9c9;}
  .gf-row.top3 .gf-rank{color:#cd7f32;}
  .gf-sprite{width:64px; height:64px; object-fit:contain; image-rendering:pixelated; background:var(--panel); border-radius:10px;}
  .gf-info{flex:1;}
  .gf-name{font-weight:700; font-size:14px;}
  .gf-coach{font-size:11px; color:var(--teal); margin-top:1px;}
  .gf-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .gf-diff{font-family:var(--mono); font-size:20px; color:var(--teal); min-width:60px; text-align:right;}
  .gf-diff.neg{color:var(--red);}

  /* audit modal */
  td.auditable{cursor:pointer; text-decoration:underline dotted var(--text-dim); text-underline-offset:3px;}
  td.auditable:hover{color:var(--amber);}
  .audit-overlay{
    position:fixed; inset:0; background:rgba(6,9,14,.7); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto;
  }
  .audit-box{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px;
    max-width:560px; width:100%;
  }
  .audit-box h3{margin:0 0 2px; font-size:15px;}
  .audit-box .audit-sub{font-size:12px; color:var(--text-dim); margin-bottom:12px;}
  .audit-list{list-style:none; margin:0; padding:0; max-height:50vh; overflow-y:auto;}
  .audit-list li{
    padding:8px 0; border-bottom:1px solid var(--border); font-size:12px; display:flex;
    justify-content:space-between; gap:10px;
  }
  .audit-list li:last-child{border-bottom:none;}
  .audit-list a{color:var(--teal); text-decoration:none;}
  .audit-list a:hover{text-decoration:underline;}
  .audit-cause{color:var(--text-dim);}

  /* replays by player */
  .player-group{
    border:1px solid var(--border); border-radius:8px; margin-bottom:10px; overflow:hidden;
  }
  .player-group summary{
    cursor:pointer; padding:10px 14px; background:var(--panel-alt);
    display:flex; align-items:center; gap:8px; list-style:none; font-size:13px;
  }
  .player-group summary::-webkit-details-marker{display:none;}
  .player-group summary::before{content:'▸'; color:var(--text-dim); font-size:11px; transition:transform .1s;}
  .player-group[open] summary::before{transform:rotate(90deg);}
  .player-group summary .pg-name{font-weight:700;}
  .player-group summary .pg-team{color:var(--text-dim); font-weight:400; font-size:12px;}
  .player-group .player-table-wrap{padding:4px 14px 12px;}
  .player-group table{margin-top:6px;}
  .player-filter{max-width:320px; margin-bottom:14px;}
.roster-admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.roster-admin-card{border:1px solid var(--border);background:var(--panel-alt);border-radius:10px;padding:12px}.roster-admin-card h3{margin:0 0 7px;font-size:14px}.roster-admin-mons{margin-top:10px;font-size:12px;line-height:1.6;color:var(--text-dim)}

  /* commissioner budget overview */
  .commissioner-budget-grid{
    display:grid;
    width:100%;
    box-sizing:border-box;
    grid-template-columns:repeat(auto-fill,minmax(clamp(145px,calc(175px * var(--budget-scale)),200px),1fr));
    gap:calc(10px * var(--budget-scale));
    margin-top:12px;
    overflow:visible;
  }
  .commissioner-budget-grid > .commissioner-budget-card{
    width:100%;
    box-sizing:border-box;
  }
  .commissioner-budget-card{
    min-width:0;
    padding:calc(12px * var(--budget-scale));
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--panel-alt);
    overflow:hidden;
  }
  .commissioner-budget-team{
    font-size:calc(13px * var(--budget-scale));
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:5px;
  }
  .commissioner-budget-main{
    font-family:var(--mono);
    font-size:calc(22px * var(--budget-scale));
    color:var(--amber);
    line-height:1.1;
  }
  .commissioner-budget-meta{
    display:flex;
    justify-content:space-between;
    gap:8px;
    margin-top:7px;
    font-family:var(--mono);
    font-size:calc(10px * var(--budget-scale));
    color:var(--text-dim);
  }
  .commissioner-budget-meta strong{color:var(--text);}
  .commissioner-budget-meta .budget-over,
  .commissioner-budget-meta .budget-over strong{color:var(--red);}
  .commissioner-budget-override{
    margin-top:6px;
    font-size:calc(9px * var(--budget-scale));
    color:var(--text-dim);
  }

  /* commissioner tab */
  .status-pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;}
  .status-pill.pending{color:var(--amber); background:#3a2c12; border:1px solid #5a4620;}
  .status-pill.approved{color:var(--teal); background:#0f2b27; border:1px solid #1c4a43;}
  .status-pill.rejected{color:var(--red); background:#3a1414; border:1px solid #5a2020;}
  .status-pill.accepted{color:var(--teal); background:#0f2b27; border:1px solid #1c4a43;}
  .status-pill.withdrawn{color:var(--text-dim); background:var(--panel-alt); border:1px solid var(--border);}
  .status-pill.reverted{color:var(--text-dim); background:var(--panel-alt); border:1px solid var(--border);}
  .trade-card{border:1px solid var(--border); border-radius:10px; background:var(--panel-alt); padding:14px; margin-bottom:10px;}
  .trade-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .trade-teams{font-weight:700; font-size:13px;}
  .trade-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .trade-cols{display:flex; gap:16px; flex-wrap:wrap; margin-top:6px;}
  .trade-col{flex:1; min-width:180px;}
  .trade-col h4{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:0 0 4px;}
  button.danger{border:1px solid var(--red); color:var(--red); background:none; border-radius:8px; padding:5px 10px; font-size:11px; cursor:pointer;}
  button.teal{background:var(--teal); color:#062521; border:none; border-radius:8px; padding:5px 10px; font-size:11px; font-weight:700; cursor:pointer;}
  
  .admin-log-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
  .admin-log-row{display:grid;grid-template-columns:170px 150px 1fr 220px;gap:12px;align-items:start;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--panel-alt)}
  .admin-log-time,.admin-log-admin{font-size:12px;color:var(--text-dim)}
  .admin-log-action{font-size:13px}
  .admin-log-message{font-size:13px;overflow-wrap:anywhere}
  @media(max-width:800px){.admin-log-row{grid-template-columns:1fr;gap:5px}}

.admin-log-admin-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:2px}

  /* Admin operation navigation: grouped, collapsible, and self-closing after selection. */
  .admin-nav{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin:0 0 18px;}
  .admin-nav-group{position:relative;flex:0 0 auto;min-width:190px;}
  .admin-nav-group-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel-alt);color:var(--text);font-weight:700;cursor:pointer;}
  .admin-nav-group-toggle span{font-size:13px;transition:transform .16s ease;}
  .admin-nav-group.open .admin-nav-group-toggle{border-bottom-left-radius:7px;border-bottom-right-radius:7px;}
  .admin-nav-group.open .admin-nav-group-toggle span{transform:rotate(180deg);}
  .admin-nav-submenu{display:none;margin-top:6px;padding:6px;border:1px solid var(--border);border-radius:10px;background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.12);}
  .admin-nav-group.open .admin-nav-submenu{display:flex;flex-direction:column;gap:3px;}
  .admin-nav-item{width:100%;text-align:left;padding:9px 11px;border:0;border-radius:7px;background:transparent;color:var(--text);cursor:pointer;font:inherit;font-size:13px;}
  .admin-nav-item:hover{background:var(--panel-alt);}
  .admin-nav-item.active{background:var(--teal);color:inherit;}
  @media(max-width:700px){.admin-nav{display:block}.admin-nav-group{width:100%;margin-bottom:7px}.admin-nav-submenu{position:static}.admin-nav-group.open .admin-nav-submenu{max-height:55vh;overflow:auto;}}

.manual-diff-panel{background:var(--panel-2,rgba(255,255,255,.025));border:1px solid var(--border,rgba(255,255,255,.08));}
.manual-diff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 10px;margin-top:12px;}
.manual-diff-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 9px;border:1px solid var(--border,rgba(255,255,255,.07));border-radius:8px;background:rgba(255,255,255,.018);min-height:36px;}
.manual-diff-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.manual-diff-input{width:72px!important;min-width:72px!important;padding:5px 7px!important;text-align:center;font-size:13px!important;border-radius:6px!important;background:rgba(255,255,255,.045)!important;border:1px solid rgba(255,255,255,.10)!important;color:var(--text)!important;box-shadow:none!important;} .manual-diff-input:focus{background:rgba(255,255,255,.065)!important;border-color:var(--teal)!important;outline:none!important;box-shadow:0 0 0 2px rgba(45,212,191,.10)!important;}
.manual-diff-help{font-size:12px;line-height:1.45;opacity:.72;margin-top:4px;}
.manual-diff-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
@media(max-width:620px){.manual-diff-grid{grid-template-columns:1fr;}}
</style>
<style id="mobile-friendly-overrides">
/* Site-wide mobile usability pass */
html{overflow-x:hidden;-webkit-text-size-adjust:100%;}
body{overflow-x:hidden;max-width:100%;}
img,video,canvas,svg{max-width:100%;}
button,input,select,textarea{font:inherit;max-width:100%;}
button{touch-action:manipulation;}

@media (max-width: 700px){
  body{font-size:14px;}
  #app{width:100%;max-width:none;box-sizing:border-box;padding-left:12px !important;padding-right:12px !important;}
  header{padding-left:0 !important;padding-right:0 !important;}
  header h1,h1{font-size:clamp(22px,7vw,32px);line-height:1.12;overflow-wrap:anywhere;}
  h2{font-size:clamp(18px,5.5vw,24px);}
  h3{font-size:17px;}
  .sub,.note,.panel-desc{overflow-wrap:anywhere;}

  /* Stacked controls instead of cramped horizontal rows */
  .toolbar,.toolbar-wide,.banner-controls,.section-head-row,.trade-tab-head,.summary-header,
  .franchise-header,.franchise-card-head,.team-card-head,.team-card-top,.speed-header,
  .replay-teams,.replay-row,.compare-team,.trade-filter-panel{max-width:100%;}
  .toolbar,.toolbar-wide,.banner-controls{flex-wrap:wrap !important;gap:8px !important;}
  .toolbar > *, .toolbar-wide > *, .banner-controls > *{min-width:0 !important;max-width:100%;}

  /* Form controls become comfortable touch targets */
  input:not([type="checkbox"]):not([type="radio"]),
  select,textarea{min-height:40px;box-sizing:border-box;}
  input:not([type="checkbox"]):not([type="radio"]),select,textarea{width:100%;}
  input[type="checkbox"],input[type="radio"]{width:auto;min-height:auto;}
  button{min-height:40px;}
  .foot-actions,.actions,.franchise-actions{flex-wrap:wrap !important;gap:8px !important;}
  .foot-actions button,.actions button,.franchise-actions button{flex:1 1 auto;}

  /* Panels/cards */
  .panel,.card,.budget-card,.trade-card,.pokemon-card,.mon-card,.opponent-card,.set-card,
  .franchise-card,.team-card,.commissioner-budget-card{min-width:0 !important;max-width:100%;box-sizing:border-box;}
  .panel{padding:14px !important;}
  .grid,.roster-grid,.roster-cards,.pokemon-grid,.team-card-grid,.franchise-cards,
  .comparison-grid,.conference-standings,.mon-grid,.theme-grid{grid-template-columns:1fr !important;}
  .trade-cols,.trade-column-grid,.profile-two-col,.summary-grid,.record-grid{grid-template-columns:1fr !important;}
  .pick-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}
  .theme-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;}

  /* Don't let long Pokémon/team names force horizontal scrolling */
  .pokemon-name,.team-name,.team-card-name,.standings-team-name,.pick-card-name,
  .mon-name,.opponent-name,.compare-team-name{overflow-wrap:anywhere;word-break:break-word;}

  /* Tables: preserve all columns, allow deliberate horizontal swipe */
  table{max-width:none;}
  .table-wrap,.franchise-table-wrap,#globalTable,#pokemonSearchTable,.player-table-wrap,
  .speed-table,.type-count-table{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .table-wrap table,.franchise-table-wrap table,#globalTable table,#pokemonSearchTable table,
  .player-table-wrap table,.speed-table table,.type-count-table table{min-width:max-content;}
  th,td{white-space:nowrap;}

  /* Modals fit inside a phone viewport */
  .modal,.modalbox,.overview-modal,.replay-summary-box,.pokemon-modal,.audit-modal,
  .modal-content{width:calc(100vw - 20px) !important;max-width:calc(100vw - 20px) !important;
    max-height:calc(100vh - 24px);box-sizing:border-box;}
  .modal-body,.pokemon-modal-body{overflow:auto;max-height:calc(100vh - 150px);}

  /* Stat/analysis rows stack cleanly */
  .gf-row{max-width:100%;}
  .death-cause-entry{max-width:100%;box-sizing:border-box;}
  .statbox{min-width:0 !important;}
  .speed-row{min-width:560px;}

  /* Draft / admin tab bars can scroll rather than squish buttons */
  .tabs{max-width:100%;overflow-x:auto;flex-wrap:nowrap !important;-webkit-overflow-scrolling:touch;}
  .tabs button{flex:0 0 auto;white-space:nowrap;}

  /* Make auth/login cards comfortable */
  #adminAuth,.gate{width:100%;max-width:420px;box-sizing:border-box;margin-left:auto;margin-right:auto;}
}

@media (max-width: 480px){

<style id="sbl-theme-final-overrides">

}

/* Major overview/team surfaces */
.team-card,
.overview-card,
.franchise-card,
.commissioner-budget-card,
.pokemon-card,

.myteam-hero,

}

/* Team cards previously had a hard-coded dark gradient. */
.team-card{background:var(--sbl-card-bg) !important;}

/* Secondary surfaces */
.mon,
.mon-pill,
.pick-card,
.pick-card.checked,
.chip,
.badge,
.speed-pin-chip,
.myteam-mon-stat,
.selected-chip{

}

/* Inputs and controls */

  border-color:var(--sbl-card-border) !important;

}

<style id="sbl-final-theme-ui-fix">
/* Final site-wide theme normalization.  All surfaces and semantic text use
   the active theme variables; fixed type colors remain intentionally untouched. */
html,body{background:var(--bg)!important;color:var(--text)!important}

/* Common surfaces */
.panel,.card,.set-card,.statbox,.notice,.team-card,.overview-card,

.showdown-saved-actions button{

/* Headings and ordinary labels must contrast on every theme. */

.team-card-name,.franchise-card-title,.pokemon-name,

}

.note,.small,.muted,.sub,.meta,.stat-label,
.speed-condition-title,.speed-detail-card label,
.switch-card-detail,.switch-card-evs,.dc-results-subheading,
.dc-auto-status,.prep-card-section>span{

}

/* Inputs */
input,textarea,select{
  background:var(--panel-alt)!important;

}

/* Team overview / roster cards: never retain a dark-only gradient. */

}

/* Pokémon profile modal header must follow the active theme. */
.pokemon-modal-head{

  color:var(--text)!important;

}

/* Switch-in analyser: the raw-damage detail belongs to the same card. */
#switchResults .switch-card-detail,
.prep-switch-card .switch-card-detail{
  background:transparent!important;
  color:var(--text-dim)!important;
  border-color:transparent!important;
}

/* Speed matrix: softer, theme-derived status cells. */
.speed-cell{background:var(--panel)!important;border-color:var(--border)!important;color:var(--text)!important}
.speed-cell.speed-faster{
  background:color-mix(in srgb,var(--teal) 12%,var(--panel))!important;
  border-color:color-mix(in srgb,var(--teal) 42%,var(--border))!important;
  color:var(--teal)!important;
}
.speed-cell.speed-slower{

  color:var(--red)!important;
}
.speed-cell.speed-tie{

}

/* Roster budget */
.budget-value.good{color:var(--teal)!important}
.budget-value.negative{color:var(--red)!important}

/* Positive / negative semantic values */
.kills,.kill,.kill-count,.stat-kills,.win-count,.wins,
.result-win,.win-text,.fixture-result,.fixture-summary,
.myteam-summary-result,.fixture-match.fixture-played .fixture-status{
  color:var(--teal)!important;
}
.loss,.loss-count,.result-loss,.loss-text,.record-loss{color:var(--red)!important}

/* Cards and rows on light themes need visible separation without glare. */
.fixture-match,.standings-row,.speed-cell,.team-card,.overview-card{
  box-shadow:0 1px 3px rgba(30,35,40,.055);
}

/* Do not override Pokémon type badge text/backgrounds. */
.type-badge,[class^="type-"],[class*=" type-"]{color:inherit}
