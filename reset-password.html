<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password - Battle Tower</title>
<link rel="stylesheet" href="css/pages/password-recovery.css?v=cp4154-password-recovery">
</head>
<body>
<main class="recovery-shell">
  <a class="back" href="index.html">← Back to Battle Tower</a>
  <section class="recovery-card">
    <div class="eyebrow">ACCOUNT SECURITY</div>
    <h1>Reset your password</h1>
    <p id="recoveryIntro">Choose a new password using the secure link sent to your registered email.</p>
    <form id="recoveryForm" hidden>
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter your new password">
      <button id="updatePasswordBtn" type="submit">Update password</button>
    </form>
    <form id="requestForm" hidden>
      <label for="recoveryEmail">Registered email</label>
      <input id="recoveryEmail" type="email" autocomplete="email" required placeholder="you@example.com">
      <button id="requestResetBtn" type="submit">Email me a reset link</button>
    </form>
    <p id="recoveryMessage" role="status" aria-live="polite"></p>
    <a id="backToLogin" href="index.html">Return to sign in</a>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="js/sbl-supabase.js" defer></script>
<script src="js/pages/password-recovery.js?v=cp4154-password-recovery" defer></script>
</body>
</html>
